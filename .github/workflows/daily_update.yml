name: Daily $7K Stock Model Cloud Update

on:
  schedule:
    # Runs after US market close on Weekdays (Mon-Fri) with staggered retries across afternoon/evening
    - cron: "15 20 * * 1-5"  # 4:15 PM ET (20:15 UTC)
    - cron: "45 20 * * 1-5"  # 4:45 PM ET (20:45 UTC)
    - cron: "30 21 * * 1-5"  # 5:30 PM ET (21:30 UTC)
    - cron: "00 23 * * 1-5"  # 7:00 PM ET (23:00 UTC)
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  daily-model-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google GenAI SDK
        run: pip install -U google-genai

      - name: Run $7,000 Stock Model Daily Update
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_model.py

      - name: Commit & Push Updated Day Tab to Live Webpage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio_state.json portfolio_data.js model_memory.json
          git diff --staged --quiet || (git commit -m "Automated Daily $7K Stock Model Update ($(date -u +'%Y-%m-%d'))" && git push)
