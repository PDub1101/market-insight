<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <script>if(window.self!==window.top){document.documentElement.classList.add("is-embedded");}</script>
  <style>html.is-embedded #backToPortfolioBtn, html.is-embedded #themeToggleBtn { display:none !important; }</style>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Market Insight — Plain-English $7,000 Investment Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       1. SOFT MATTE SLATE (DEFAULT CALM DARK MODE — ZERO NEON) & CLEAN LIGHT MODE
       ========================================================================== */
    :root,
    html[data-theme="slate"] {
      --bg-page: #11141b;
      --bg-header: rgba(17, 20, 27, 0.92);
      --bg-ribbon: #151922;
      --bg-card: #181d27;
      --bg-card-alt: #1d2330;
      --bg-card-hover: #222938;
      --bg-highlight: #1e2636;
      --border-subtle: #262e3d;
      --border-strong: #364156;

      --text-primary: #eef1f7;
      --text-secondary: #a5b0c2;
      --text-muted: #737f94;

      --accent-primary: #6b93e8;
      --accent-primary-bg: rgba(107, 147, 232, 0.14);
      --accent-primary-border: rgba(107, 147, 232, 0.32);

      --pos: #3eb481;
      --pos-bg: rgba(62, 180, 129, 0.13);
      --pos-border: rgba(62, 180, 129, 0.30);

      --neg: #e26d67;
      --neg-bg: rgba(226, 109, 103, 0.13);
      --neg-border: rgba(226, 109, 103, 0.30);

      --warn: #dfa247;
      --warn-bg: rgba(223, 162, 71, 0.13);
      --warn-border: rgba(223, 162, 71, 0.30);

      --pill-active-bg: #eef1f7;
      --pill-active-text: #11141b;

      --chart-grid: #252c3b;
      --shadow-card: none;
      --shadow-subtle: none;
      --shadow-modal: 0 16px 40px rgba(0, 0, 0, 0.55);
    }

    html[data-theme="light"] {
      --bg-page: #f8fafc;
      --bg-header: rgba(255, 255, 255, 0.96);
      --bg-ribbon: #f1f5f9;
      --bg-card: #ffffff;
      --bg-card-alt: #f8fafc;
      --bg-card-hover: #f1f5f9;
      --bg-highlight: #f0f7ff;
      --border-subtle: #e2e8f0;
      --border-strong: #cbd5e1;

      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;

      --accent-primary: #1d4ed8;
      --accent-primary-bg: rgba(29, 78, 216, 0.08);
      --accent-primary-border: rgba(29, 78, 216, 0.25);

      --pos: #059669;
      --pos-bg: #ecfdf5;
      --pos-border: #a7f3d0;

      --neg: #dc2626;
      --neg-bg: #fef2f2;
      --neg-border: #fecaca;

      --warn: #b45309;
      --warn-bg: #fffbeb;
      --warn-border: #fde68a;

      --pill-active-bg: #0f172a;
      --pill-active-text: #ffffff;

      --chart-grid: #e2e8f0;
      --shadow-card: none;
      --shadow-subtle: none;
      --shadow-modal: 0 16px 36px rgba(15, 23, 42, 0.14);
    }

    :root {
      --font-heading: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius-sm: 3px;
      --radius-md: 4px;
      --radius-lg: 4px;
      --radius-pill: 4px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 84px;
      transition: background 0.2s ease, color 0.2s ease;
    }

    button, select {
      font-family: inherit;
    }

    /* ==========================================================================
       2. STICKY TOP BAR, CONTROLS & MARKET RIBBON
       ========================================================================== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 60;
      background: var(--bg-header);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
    }
    .topbar-inner {
      max-width: 1220px;
      margin: 0 auto;
      padding: 13px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--accent-primary-bg);
      border: 1px solid var(--accent-primary-border);
      color: var(--accent-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 15px;
    }
    .brand-name {
      font-family: var(--font-heading);
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: var(--text-primary);
      line-height: 1.15;
    }
    .brand-sub {
      font-size: 12.5px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .control-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
    }
    .control-chip select {
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      outline: none;
    }
    .control-chip select option {
      background: var(--bg-card);
      color: var(--text-primary);
    }
    .toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .toggle-btn:hover {
      border-color: var(--border-strong);
      color: var(--text-primary);
      background: var(--bg-card-hover);
    }
    .toggle-btn.active {
      background: var(--accent-primary-bg);
      border-color: var(--accent-primary-border);
      color: var(--accent-primary);
    }

    .ribbon {
      background: var(--bg-ribbon);
      border-bottom: 1px solid var(--border-subtle);
      padding: 7px 24px;
      overflow-x: auto;
      white-space: nowrap;
    }
    .ribbon-inner {
      max-width: 1220px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 22px;
    }
    .ribbon-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      color: var(--text-secondary);
    }
    .ribbon-name {
      font-weight: 600;
      color: var(--text-primary);
    }
    .ribbon-price {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-secondary);
    }
    .ribbon-chg {
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 5px;
    }
    .ribbon-chg.pos { color: var(--pos); background: var(--pos-bg); }
    .ribbon-chg.neg { color: var(--neg); background: var(--neg-bg); }

    /* ==========================================================================
       3. PAGE CONTAINER & DAY SELECTOR BAR
       ========================================================================== */
    .page-wrap {
      max-width: 1220px;
      margin: 0 auto;
      padding: 20px 24px 0;
    }

    .day-bar-wrap {
      margin-bottom: 26px;
    }
    .day-bar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 9px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .day-bar-label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .updated-stamp {
      font-size: 12px;
      color: var(--text-muted);
    }
    .day-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: thin;
    }
    .day-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 15px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .day-pill:hover {
      border-color: var(--border-strong);
      color: var(--text-primary);
      background: var(--bg-card-hover);
    }
    .day-pill.active {
      background: var(--pill-active-bg);
      color: var(--pill-active-text);
      border-color: var(--pill-active-bg);
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--pos);
      display: inline-block;
    }
    .day-pill.active .live-dot {
      background: #3eb481;
    }

    /* ==========================================================================
       4. CHAPTER / SECTION BLOCKS (SPACIOUS VERTICAL STORYTELLING)
       ========================================================================== */
    /* ==========================================================================
       4. CHAPTER / SECTION BLOCKS - OPEN ARCHITECTURE (ZERO ENCLOSING CARDS)
       ========================================================================== */
    .chapter {
      background: transparent;
      border: none;
      border-top: 1px solid var(--border-subtle);
      border-radius: 0;
      padding: 36px 0 20px;
      margin-bottom: 32px;
      box-shadow: none;
    }
    .chapter:first-of-type {
      border-top: none;
      padding-top: 12px;
    }
    .chapter-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--accent-primary);
      margin-bottom: 6px;
    }
    .chapter-title {
      font-family: var(--font-heading);
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -0.35px;
      color: var(--text-primary);
      line-height: 1.3;
    }
    .chapter-desc {
      font-size: 14.5px;
      color: var(--text-secondary);
      margin-top: 5px;
      max-width: 880px;
    }
    .chapter-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    /* Jump Navigation inside Day View */
    .quick-jump {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .jump-link {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 4px 11px;
      border-radius: 4px;
      text-decoration: none;
      transition: all 0.15s ease;
      font-family: var(--font-mono);
    }
    .jump-link:hover {
      color: var(--text-primary);
      border-color: var(--border-strong);
      background: var(--bg-card-hover);
    }

    /* ==========================================================================
       5. SECTION 1: OPEN KPI TELEMETRY STRIP (BLOOMBERG / YAHOO FINANCE STYLE)
       ========================================================================== */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      margin: 22px 0;
      border-top: 1px solid var(--border-subtle);
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-card-alt);
    }
    @media (max-width: 960px) {
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 540px) {
      .stat-grid { grid-template-columns: 1fr; }
    }
    .stat-card {
      background: transparent;
      border: none;
      border-right: 1px solid var(--border-subtle);
      border-radius: 0;
      padding: 16px 20px;
      position: relative;
    }
    .stat-grid > .stat-card:last-child {
      border-right: none;
    }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 3px;
    }
    .stat-card:nth-child(1)::before { background: var(--accent-primary); }
    .stat-card:nth-child(2)::before { background: var(--pos); }
    .stat-card:nth-child(3)::before { background: var(--warn); }
    .stat-card:nth-child(4)::before { background: #8b5cf6; }
    .stat-label {
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .stat-num {
      font-family: var(--font-heading);
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-primary);
      line-height: 1.15;
    }
    .stat-note {
      font-size: 12.5px;
      font-weight: 500;
      margin-top: 7px;
      color: var(--text-secondary);
    }
    .txt-pos { color: var(--pos) !important; font-weight: 600; }
    .txt-neg { color: var(--neg) !important; font-weight: 600; }
    .txt-warn { color: var(--warn) !important; font-weight: 600; }

    .plain-story-box {
      background: var(--bg-highlight);
      border: 1px solid var(--border-subtle);
      border-left: 3px solid var(--accent-primary);
      border-radius: 4px;
      padding: 18px 22px;
    }
    .plain-story-heading {
      font-family: var(--font-heading);
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .story-bullets {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }
    .story-bullet {
      display: grid;
      grid-template-columns: 26px 1fr;
      gap: 10px;
      align-items: start;
      font-size: 14.5px;
      color: var(--text-primary);
      line-height: 1.55;
    }
    .bullet-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent-primary-bg);
      color: var(--accent-primary);
      font-weight: 700;
      font-size: 12.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }
    .story-bullet strong {
      color: var(--text-primary);
    }

    /* ==========================================================================
       6. SECTION 2: INTERACTIVE CHART & 9-OPTION COMPARISON CARDS
       ========================================================================== */
    .chart-box {
      background: var(--bg-card-alt);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      margin-bottom: 24px;
      position: relative;
    }
    .chart-toggles {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
      align-items: center;
    }
    .series-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 11px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      opacity: 0.55;
      transition: all 0.15s ease;
    }
    .series-pill.on {
      opacity: 1;
      color: var(--text-primary);
      border-color: var(--border-strong);
    }
    .series-swatch {
      width: 11px;
      height: 11px;
      border-radius: 3px;
    }
    .chart-svg-wrap {
      position: relative;
      width: 100%;
    }
    .chart-svg {
      width: 100%;
      height: 290px;
      display: block;
      cursor: crosshair;
    }
    .chart-tooltip {
      position: absolute;
      top: 12px;
      left: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      box-shadow: var(--shadow-card);
      pointer-events: none;
      display: none;
      z-index: 15;
      min-width: 235px;
      font-size: 12.5px;
    }
    .chart-tooltip-date {
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 7px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .chart-tooltip-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 2px 0;
    }

        /* Koyfin / Morningstar Comparative Benchmark Matrix */
    .compare-kpi-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .compare-kpi-card {
      background: var(--bg-card-alt);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .compare-kpi-label {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }
    .compare-kpi-val {
      font-family: var(--font-mono);
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .compare-kpi-sub {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .compare-table-wrap {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      overflow-x: auto;
      margin-bottom: 24px;
      box-shadow: var(--shadow-subtle);
    }
    .compare-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
      white-space: nowrap;
    }
    .compare-table th {
      background: var(--bg-card-alt);
      padding: 11px 14px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-strong);
      text-align: left;
    }
    .compare-table th.num-col,
    .compare-table td.num-col {
      text-align: right;
    }
    .compare-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      vertical-align: middle;
    }
    .compare-table tbody tr:hover {
      background: var(--bg-card-hover);
    }
    .compare-table tr.row-model {
      background: var(--accent-primary-bg);
      font-weight: 600;
    }
    .compare-table tr.row-model td {
      border-top: 1px solid var(--accent-primary-border);
      border-bottom: 1px solid var(--accent-primary-border);
    }
    .compare-table tr.row-model:hover {
      background: var(--accent-primary-bg);
    }
    .compare-table tr.row-model-v2 {
      background: rgba(16, 185, 129, 0.08);
      font-weight: 600;
    }
    .compare-table tr.row-model-v2 td {
      border-top: 1px solid rgba(16, 185, 129, 0.35);
      border-bottom: 1px solid rgba(16, 185, 129, 0.35);
    }
    .compare-table tr.row-model-v2:hover {
      background: rgba(16, 185, 129, 0.14);
    }
    .table-rank-badge.rank-v2 {
      background: rgba(16, 185, 129, 0.18);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .table-rank-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--bg-card-alt);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      display: inline-block;
      text-align: center;
      min-width: 28px;
    }
    .table-rank-badge.rank-1 {
      background: var(--warn-bg);
      border-color: var(--warn-border);
      color: var(--warn);
    }
    .table-asset-name {
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .table-asset-sub {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .table-tag-model {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 3px;
      background: var(--accent-primary);
      color: #ffffff;
      letter-spacing: 0.04em;
    }
    .table-category-tag {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--bg-card-alt);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
    }
    .table-val-mono {
      font-family: var(--font-mono);
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-primary);
    }

       10. STOCK INSPECTOR MODAL (PLAIN-ENGLISH DOSSIER)

    .modal-backdrop {

  <script>
    /* ==========================================================================
       STATE & PREFERENCES
       ========================================================================== */
    let appData = window.MARKET_INSIGHT_DATA || null;
    let selectedView = 0;       // integer day index, or 'overview', or 'memory'
    let activeModel = 'v2';     // 'v2' (Active Enhanced Model - default) | 'v1' (Baseline)
    let capitalScale = 1.0;
    let showRawMath = false;
    let tradeFilter = 'all';    // 'all' | 'buy' | 'trim' | 'win' | 'lag'
    let watchFilter = 'all';    // 'all' | 'BUY' | 'HOLD' | 'TRIM'

    function getActivePortfolio(tab) {
      if (activeModel === 'v2' && tab && tab.portfolio_v2) {
        return tab.portfolio_v2;
      }
      return (tab && tab.portfolio) || {};
    }

    function getActiveHoldings(tab) {
      if (activeModel === 'v2' && tab && tab.holdings_v2 && tab.holdings_v2.length > 0) {
        return tab.holdings_v2;
      }
      return (tab && tab.holdings) || [];
    }

    /* ==========================================================================
       FORMATTING & PLAIN-ENGLISH TRANSLATION ENGINE
       ========================================================================== */
    function scaled(val) {
      return Number(val || 0) * capitalScale;
    }

    function baseStartDollars() {
      return Math.round(7000 * capitalScale);
    }

    function fmtMoney(val, showPlus = false) {
      const num = Number(val || 0);
      const sign = num > 0.004 ? (showPlus ? '+' : '') : (num < -0.004 ? '-' : '');
      return sign + '$' + Math.abs(num).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function fmtPct(val, showPlus = true) {
      const num = Number(val || 0);
      const sign = num > 0.004 ? (showPlus ? '+' : '') : '';
      return sign + num.toFixed(2) + '%';
    }

    function normalizeActionType(rawAction) {
      const s = String(rawAction || 'HOLD').toUpperCase();
      if (s.includes('BUY')) return 'BUY';
      if (s.includes('STOP_LOSS') || s.includes('STOP')) return 'STOP_LOSS';
      if (s.includes('EXIT')) return 'EXIT';
      if (s.includes('FORK')) return 'FORK';
      if (s.includes('TRIM') || s.includes('SELL')) return 'TRIM';
      return 'HOLD';
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Translates technical Python model strings into natural, conversational English!
    function translateReasonToPlainEnglish(rawReason, rawAction) {
      if (!rawReason) return "Selected based on steady price trend and risk balance.";
      if (showRawMath) return rawReason;

      const act = normalizeActionType(rawAction);
      let s = String(rawReason);

      // Check for Liquidated prefix (Model v2 stop-loss & exit actions):
      // "Liquidated 100% ($241.58) at $34.51 (PnL: -7.5%) — STOP_LOSS"
      const liqMatch = s.match(/Liquidated\s+(\d+%)\s+\(\$([\d,.]+)\)\s+at\s+\$([\d,.]+)\s+\(PnL:\s*([+-]?[\d.]+)%\)\s*—\s*(\w+)/i);
      if (liqMatch) {
        const pct = liqMatch[1];
        const proceeds = liqMatch[2];
        const px = liqMatch[3];
        const pnl = parseFloat(liqMatch[4]);
        const actType = liqMatch[5].toUpperCase();
        if (actType === 'STOP_LOSS') {
          return `Strict -7% stop-loss discipline: liquidated ${pct} ($${proceeds}) at $${px} (${pnl.toFixed(1)}% vs entry) to cap downside risk and preserve capital in cash.`;
        } else if (actType === 'EXIT') {
          return `Defensive exit: liquidated ${pct} ($${proceeds}) at $${px} (${pnl.toFixed(1)}%) after stock score broke down, rotating capital into cash defense.`;
        } else if (actType === 'TRAILING_STOP') {
          return `Trailing stop: sold ${pct} ($${proceeds}) at $${px} (${pnl.toFixed(1)}%) after pulling back 5% from recent highs to protect open profits.`;
        }
      }

      // Check for Model v2 Fork Launch:
      if (/Model v2\.0 officially launched/i.test(s) || /MODEL_FORK/i.test(rawAction)) {
        return "Model v2.0 live forward-test launch: activated strict -7.0% stop-losses, dynamic market regime cash defense (triggered when SPY is below 50d average), and Gemini AI risk vetoes.";
      }

      const parts = [];

      // Check for Trimmed prefix: "Trimmed 40% ($330) at $1373.70 (+8.7% vs entry)"
      const trimMatch = s.match(/Trimmed\s+(\d+%)\s+\(\$[\d,.]+\)\s+at\s+\$([\d,.]+)\s+\(([+-]?[\d.]+)%\s+vs\s+entry\)/i);
      if (trimMatch) {
        const pctSold = trimMatch[1];
        const px = trimMatch[2];
        const vsEntry = parseFloat(trimMatch[3]);
        if (vsEntry >= 0) {
          parts.push(`Sold ${pctSold} of our shares at $${px} to lock in a +${vsEntry.toFixed(1)}% profit`);
        } else {
          parts.push(`Sold ${pctSold} of our shares at $${px} (${vsEntry.toFixed(1)}% below our buy price) to cut risk and prevent a deeper loss`);
        }
      }

      // Trend phrases
      if (/Confirmed uptrend above 20d.*50d/i.test(s)) {
        parts.push(parts.length ? "while the stock is climbing above both its 1-month and 2.5-month averages" : "Climbing steadily above both its 1-month and 2.5-month average prices");
      } else if (/Constructive dip toward 50d support/i.test(s)) {
        parts.push(parts.length ? "after a mild pullback toward its 2.5-month support floor" : "Pulled back slightly to a calmer price near its 2.5-month average while keeping its broader uptrend intact");
      } else if (/Trading below 50d moving average/i.test(s)) {
        parts.push(parts.length ? "because the stock slipped below its 2.5-month average trend" : "Currently trading below its 2.5-month average price (showing downward pressure)");
      }

      // RSI / Momentum phrases
      if (/Short-term extended \(RSI ([\d.]+)/i.test(s)) {
        parts.push("and a fast recent jump left the price temporarily overheated");
      } else if (/Healthy momentum zone/i.test(s)) {
        parts.push("with a healthy, balanced price temperature (not overheated)");
      } else if (/Attractive swing entry on cooldown/i.test(s)) {
        parts.push("after cooling off to a more reasonable entry price");
      } else if (/Deeply oversold/i.test(s)) {
        parts.push("after heavy selling pushed the stock to a beaten-down level");
      }

      // Relative strength vs S&P 500
      const outMatch = s.match(/Outperforming S&P 500 by \+?([\d.]+)% over 20d/i);
      if (outMatch) {
        parts.push(`and beating the S&P 500 market average by +${outMatch[1]}% over the past month`);
      }
      const lagMatch = s.match(/Lagging S&P 500 \(-?([\d.]+)% over 20d\)/i);
      if (lagMatch) {
        parts.push(`and trailing behind the S&P 500 by ${lagMatch[1]}% over the past month`);
      }

      // Cooldown penalty
      if (/Self-learning cooldown/i.test(s)) {
        parts.push("— currently placed in the AI's cooldown penalty box due to recent losses");
      }

      if (parts.length === 0) {
        return s.replace(/•/g, ' — ');
      }

      let sentence = parts.join(', ').replace(/, —/g, ' —').replace(/, and /g, ' and ');
      sentence = sentence.charAt(0).toUpperCase() + sentence.slice(1);
      if (!sentence.endsWith('.')) sentence += '.';
      return sentence;
    }

    function describePriceTemp(rsi) {
      const v = Number(rsi || 50);
      if (showRawMath) return `RSI ${v.toFixed(1)}`;
      if (v <= 32) return "Deep Bargain / Beaten Down";
      if (v <= 43) return "Cooled Off / Dip Zone";
      if (v <= 66) return "Healthy Normal Price";
      if (v <= 72) return "Warm / Strong Demand";
      return "Overheated / Pricey";
    }

    function describeTrendSimple(s) {
      if (showRawMath) {
        return `20d: ${fmtMoney(s.sma20)} | 50d: ${fmtMoney(s.sma50)}`;
      }
      const p = Number(s.price || 0);
      const m20 = Number(s.sma20 || p);
      const m50 = Number(s.sma50 || p);
      if (p >= m20 && m20 >= m50) return "↗ Steady Uptrend";
      if (p >= m50 && p < m20) return "↔ Mild Pullback in Uptrend";
      if (p >= m20 && p < m50) return "↗ Trying to Recover";
      return "↘ Sliding Below Average";
    }

    function describeWatchVerdict(s, heldSet, exitedSet) {
      const sig = normalizeActionType(s.signal);
      const isHeld = heldSet && heldSet.has(s.ticker);
      const isExited = exitedSet && exitedSet.has(s.ticker);
      if (isExited && activeModel === 'v2') {
        return { text: "Stopped Out / In Cash", cls: "STOP_LOSS" };
      }
      if (sig === 'BUY') {
        return isHeld
          ? { text: "Strong — Already Own", cls: "BUY" }
          : { text: "Top Buy Candidate", cls: "BUY" };
      }
      if (sig === 'HOLD') {
        return isHeld
          ? { text: "Steady — Holding", cls: "HOLD" }
          : { text: "Watching — Fair", cls: "HOLD" };
      }
      if (Number(s.rsi14 || 50) > 72) {
        return { text: "Wait — Too Overheated", cls: "TRIM" };
      }
      return isHeld
        ? { text: "Trim / Reduce Risk", cls: "TRIM" }
        : { text: "Avoiding — Weak Trend", cls: "TRIM" };
    }

        const hasRiskExit = actions.some(a => normalizeActionType(a.action) === 'STOP_LOSS' || normalizeActionType(a.action) === 'EXIT');

          b2 = `<strong>Today's risk-protection moves (${actions.length} adjustments):</strong> Executed disciplined risk exits (${actions.map(a => `${normalizeActionType(a.action) === 'STOP_LOSS' ? 'stopped out' : normalizeActionType(a.action) === 'EXIT' ? 'exited' : normalizeActionType(a.action) === 'BUY' ? 'bought' : 'trimmed'} <strong>${escapeHtml(a.ticker)} (${fmtMoney(scaled(a.rec_dollars))})</strong>`).join(', ')}) to cut declining positions and establish our tactical cash defense shield.`;
        } else {
          const summaries = actions.map(a => {
            const t = normalizeActionType(a.action);
            if (t === 'BUY') return `bought <strong>${fmtMoney(scaled(a.rec_dollars))} of ${escapeHtml(a.ticker)}</strong>`;
            if (t === 'TRIM') return `sold <strong>${fmtMoney(scaled(a.rec_dollars))} of ${escapeHtml(a.ticker)}</strong>`;
            return `held <strong>${escapeHtml(a.ticker)}</strong>`;
          });
          b2 = `<strong>Today's moves (${actions.length} portfolio adjustments):</strong> The model ${summaries.join(', then ')} — freeing up money from overheated or lagging stocks and rotating it into steadier performers. (See full plain-English breakdown in Section 3 below.)`;
        }
      }

      // Bullet 3: Honest plain-English comparison vs passive options + winners/drags
      const winners = holdings.filter(h => Number(h.pnl_dollars || 0) > 0).sort((a, b) => b.pnl_dollars - a.pnl_dollars);
      const losers = holdings.filter(h => Number(h.pnl_dollars || 0) < 0).sort((a, b) => a.pnl_dollars - b.pnl_dollars);

      let b3 = '';
      if (leader && (leader.id !== modelAlt.id)) {
        const gap = Math.abs(leader.value - p.total_value);
        const spyGap = spyAlt ? (p.total_value - spyAlt.value) : 0;
        const otherGap = otherModelAlt.value ? (p.total_value - otherModelAlt.value) : 0;
        const winText = winners.length > 0
          ? `${winners.length} of your ${holdings.length} current holdings are profitable (led by <strong>${escapeHtml(winners[0].ticker)} ${fmtMoney(scaled(winners[0].pnl_dollars), true)}</strong>)`
          : `holdings are still settling in`;
        const dragText = losers.length > 0
          ? `, while <strong>${escapeHtml(losers[0].ticker)} (${fmtMoney(scaled(losers[0].pnl_dollars), true)})</strong> is currently lagging`
          : `.`;
        b3 = `<strong>Why we rank #${modelAlt.rank} of 9 right now:</strong> Steady dividend stocks (<strong>${escapeHtml(leader.name)}</strong>, up ${fmtPct(leader.gain_pct)}) currently lead by ${fmtMoney(scaled(gap))}. Inside ${activeModel === 'v2' ? 'Model 2.0' : 'our portfolio'}, ${winText}${dragText}. Overall, ${activeModel === 'v2' ? 'Model 2.0' : 'the portfolio'} is ${spyGap >= 0 ? `<strong>${fmtMoney(scaled(spyGap))} ahead</strong> of the S&amp;P 500` : `<strong>${fmtMoney(scaled(Math.abs(spyGap)))} behind</strong> the S&amp;P 500`}${activeModel === 'v2' && otherModelAlt.value ? ` and <strong>${fmtMoney(scaled(otherGap), true)}</strong> vs. Baseline Model 1.0.` : '.'}`;
      } else {
        b3 = `<strong>Leaderboard check:</strong> ${activeModel === 'v2' ? 'Model 2.0' : 'Our model'} is currently <strong>#1 out of all 9 investment options</strong> at ${totalStr}!`;
      }

      // Optional Bullet 4: Risk Guardrails & Cash Shield
      let b4 = '';
      if (activeModel === 'v2') {
        const isCashShield = (p.cash_reserve / p.total_value) >= 0.20;
        if (isCashShield) {
          b4 = `<strong>Tactical Cash Shield Active:</strong> Because the S&amp;P 500 is trading below its 50-day average trend, Model 2.0 automatically enforces a minimum 25–35% cash shield (${fmtMoney(scaled(p.cash_reserve))} in cash defense) to buffer against wider market pullbacks and prevent chasing volatile dips.`;
        } else {
          b4 = `<strong>Risk Guardrails Active:</strong> Model 2.0 has strict -7.0% stop-losses and anti-whipsaw 4-day cooldowns armed to limit downside risk and protect portfolio capital.`;
        }
      } else {
        const cooldowns = (tab.adaptive_learning && tab.adaptive_learning.cooldown_tickers) || [];
        if (cooldowns.length > 0) {
          b4 = `<strong>Guardrail active (stocks the AI refused to chase today):</strong> Even though <strong>${escapeHtml(cooldowns.join(' and '))}</strong> look "cheaper" after dropping, the model blocked buying any more shares because their short-term trend is still pointing down.`;
        }
      }

      return [b1, b2, b3, b4].filter(Boolean);
    }

    function switchCompareView(mode) {
      const tableEl = document.getElementById('compareTableView');
      const cardsEl = document.getElementById('compareCardsView');
      const btnTable = document.getElementById('btnViewTable');
      const btnCards = document.getElementById('btnViewCards');
      if (!tableEl || !cardsEl) return;
      if (mode === 'cards') {
        tableEl.style.display = 'none';
        cardsEl.style.display = 'grid';
        if (btnTable) btnTable.classList.remove('active');
        if (btnCards) btnCards.classList.add('active');
      } else {
        tableEl.style.display = 'block';
        cardsEl.style.display = 'none';
        if (btnTable) btnTable.classList.add('active');
        if (btnCards) btnCards.classList.remove('active');
      }
    }

    function buildCompareKpiBar(alts, modelVal, startCap) {
      if (!alts || alts.length === 0) return '';
      const v2Opt = alts.find(a => a.id === 'model_v2') || {};
      const v1Opt = alts.find(a => a.id === 'model' || (a.is_model && a.id !== 'model_v2')) || {};
      const spyOpt = alts.find(a => a.id === 'spy_mutual' || a.name.includes('S&P 500')) || {};
      const topOpt = alts.slice().sort((a,b) => a.rank - b.rank)[0] || {};

      const v2Up = (v2Opt.gain_dollars || 0) >= 0;
      const v1Up = (v1Opt.gain_dollars || 0) >= 0;
      const topUp = (topOpt.gain_dollars || 0) >= 0;

      const alphaV2vsV1 = (v2Opt.value || modelVal) - (v1Opt.value || modelVal);
      const alphaPct = (v2Opt.gain_pct || 0) - (v1Opt.gain_pct || 0);

      return `
        <div class="compare-kpi-bar">
          <div class="compare-kpi-card" style="border-left: 3px solid #10b981;">
            <span class="compare-kpi-label">Model v2.0 (Enhanced)</span>
            <span class="compare-kpi-val">${fmtMoney(scaled(v2Opt.value || modelVal))}</span>
            <span class="compare-kpi-sub ${v2Up ? 'txt-pos' : 'txt-neg'}">
              ${fmtMoney(scaled(v2Opt.gain_dollars || 0), true)} (${fmtPct(v2Opt.gain_pct || 0)}) • Rank #${v2Opt.rank || 4}
            </span>
          </div>

          <div class="compare-kpi-card" style="border-left: 3px solid var(--accent-primary);">
            <span class="compare-kpi-label">Model v1.0 (Baseline)</span>
            <span class="compare-kpi-val">${fmtMoney(scaled(v1Opt.value || modelVal))}</span>
            <span class="compare-kpi-sub ${v1Up ? 'txt-pos' : 'txt-neg'}">
              ${fmtMoney(scaled(v1Opt.gain_dollars || 0), true)} (${fmtPct(v1Opt.gain_pct || 0)}) • Rank #${v1Opt.rank || 7}
            </span>
          </div>

          <div class="compare-kpi-card" style="border-left: 3px solid #38bdf8;">
            <span class="compare-kpi-label">v2.0 Alpha over Baseline v1.0</span>
            <span class="compare-kpi-val ${alphaV2vsV1 >= 0 ? 'txt-pos' : 'txt-neg'}">
              ${alphaV2vsV1 >= 0 ? '+' : ''}${fmtMoney(scaled(alphaV2vsV1))}
            </span>
            <span class="compare-kpi-sub ${alphaPct >= 0 ? 'txt-pos' : 'txt-neg'}">
              ${alphaPct >= 0 ? '+' : ''}${alphaPct.toFixed(2)}% outperformance
            </span>
          </div>

          <div class="compare-kpi-card">
            <span class="compare-kpi-label">Top Benchmark (#1)</span>
            <span class="compare-kpi-val">${fmtMoney(scaled(topOpt.value || 0))}</span>
            <span class="compare-kpi-sub ${topUp ? 'txt-pos' : 'txt-neg'}">
              ${escapeHtml(topOpt.name || 'Top Option')}: ${fmtPct(topOpt.gain_pct || 0)}
            </span>
          </div>
        </div>
      `;
    }

    function buildComparativeMatrixTable(alts, modelVal, startCap) {
      if (!alts || alts.length === 0) return '';
      const values = alts.map(a => a.value);
      const minV = Math.min(...values, startCap * 0.96);
      const maxV = Math.max(...values, startCap * 1.03);

      const rows = alts.map(a => {
        const up = a.gain_dollars >= 0;
        const barPct = maxV > minV ? Math.max(10, Math.min(100, ((a.value - minV) / (maxV - minV)) * 100)) : 50;
        const isV2 = a.id === 'model_v2' || a.is_model_v2;
        const isV1 = a.id === 'model' || (a.is_model && !isV2);
        const barColor = isV2 ? '#10b981' : (isV1 ? 'var(--accent-primary)' : (up ? 'var(--pos)' : 'var(--neg)'));
        const diff = (alts.find(x => x.id === 'model_v2') || { value: modelVal }).value - a.value;

        let spreadHtml = '';
        if (isV2) {
          spreadHtml = `<span class="table-tag-model" style="background:rgba(16,185,129,0.18);color:#10b981;border:1px solid rgba(16,185,129,0.35);">Enhanced Active</span>`;
        } else if (isV1) {
          spreadHtml = `<span class="table-tag-model">Baseline v1.0</span>`;
        } else if (Math.abs(diff) < 0.05) {
          spreadHtml = `<span>Tied vs v2</span>`;
        } else if (diff > 0) {
          spreadHtml = `<span class="txt-pos">+${fmtMoney(scaled(diff))} Behind v2</span>`;
        } else {
          spreadHtml = `<span class="txt-neg">-${fmtMoney(scaled(Math.abs(diff)))} Ahead of v2</span>`;
        }

        return `
          <tr class="${isV2 ? 'row-model-v2' : (isV1 ? 'row-model' : '')}">
            <td style="width: 44px; text-align: center;">
              <span class="table-rank-badge ${a.rank === 1 ? 'rank-1' : (isV2 ? 'rank-v2' : '')}">#${a.rank}</span>
            </td>
            <td>
              <div class="table-asset-name">
                ${escapeHtml(a.name)}
                ${isV2 ? '<span class="table-tag-model" style="background:rgba(16,185,129,0.18);color:#10b981;border:1px solid rgba(16,185,129,0.35);">v2.0 Enhanced</span>' : (isV1 ? '<span class="table-tag-model">v1.0 Baseline</span>' : '')}
              </div>
              <div class="table-asset-sub">${escapeHtml(a.subtitle || '')}</div>
            </td>
            <td>
              <span class="table-category-tag">${escapeHtml(a.category || '')}</span>
            </td>
            <td class="num-col">
              <span class="table-val-mono">${fmtMoney(scaled(a.value))}</span>
            </td>
            <td class="num-col">
              <span class="table-chg-mono ${up ? 'txt-pos' : 'txt-neg'}">
                ${fmtMoney(scaled(a.gain_dollars), true)}
              </span>
            </td>
            <td class="num-col">
              <span class="table-chg-mono ${up ? 'txt-pos' : 'txt-neg'}">
                ${fmtPct(a.gain_pct)}
              </span>
            </td>
            <td class="num-col table-spread-cell">
              ${spreadHtml}
            </td>
            <td class="table-bar-cell">
              <div class="table-micro-bar" title="${barPct.toFixed(1)}% of benchmark range">
                <div class="table-micro-fill" style="width:${barPct.toFixed(1)}%;background:${barColor};"></div>
              </div>
            </td>
          </tr>
        `;
      }).join('');

      return `
        <div class="compare-table-wrap">
          <table class="compare-table">
            <thead>
              <tr>
                <th style="width:44px; text-align:center;">Rank</th>
                <th>Strategy / Benchmark Asset</th>
                <th>Asset Class</th>
                <th class="num-col">Current NAV</th>
                <th class="num-col">Return ($)</th>
                <th class="num-col">Return (%)</th>
                <th class="num-col">Active Spread vs Model</th>
                <th class="table-bar-cell">Relative Strength</th>
              </tr>
            </thead>
            <tbody>
              ${rows}
            </tbody>
          </table>
        </div>
      `;
    }

    function buildAll8OptionCards(alts, modelVal, startCap) {
      if (!alts || alts.length === 0) return '';
      const values = alts.map(a => a.value);
      const minV = Math.min(...values, startCap * 0.96);
      const maxV = Math.max(...values, startCap * 1.03);

      const v2Opt = alts.find(x => x.id === 'model_v2' || x.is_model_v2);
      const v1Opt = alts.find(x => x.id === 'model' || (x.is_model && !x.is_model_v2));
      const refVal = (activeModel === 'v2' && v2Opt ? v2Opt.value : (v1Opt ? v1Opt.value : modelVal));

      return alts.map(a => {
        const up = a.gain_dollars >= 0;
        const barPct = maxV > minV ? Math.max(10, Math.min(100, ((a.value - minV) / (maxV - minV)) * 100)) : 50;
        const isV2 = a.id === 'model_v2' || a.is_model_v2;
        const isV1 = a.id === 'model' || (a.is_model && !isV2);
        const barColor = isV2 ? '#10b981' : (isV1 ? 'var(--accent-primary)' : (up ? 'var(--pos)' : 'var(--neg)'));
        const desc = OPTION_PLAIN_ENGLISH[a.id] || a.subtitle || '';

        let vsLine = '';

    function toggleChartSeries(seriesId) {
      const item = CHART_SERIES_META.find(s => s.id === seriesId);
      if (!item) return;
      // Keep at least 1 line visible
      const activeCount = CHART_SERIES_META.filter(s => s.on).length;
      if (item.on && activeCount <= 1) return;
      item.on = !item.on;
      const upToIdx = typeof selectedView === 'number' ? selectedView : appData.day_tabs.length - 1;
      renderInteractiveChart(upToIdx);
    }

    function renderInteractiveChart(upToDayIdx) {
      const pillsEl = document.getElementById('chartSeriesPills');
      const svg = document.getElementById('comparisonChartSvg');
      const tooltip = document.getElementById('chartHoverTooltip');
      if (!svg || !pillsEl || !appData || !appData.day_tabs) return;

      // Render toggle pills
      pillsEl.innerHTML = `<span style="font-size:12px;font-weight:600;color:var(--text-muted);margin-right:4px;">Click to show/hide lines:</span>` +
        CHART_SERIES_META.map(s => `
          <button class="series-pill ${s.on ? 'on' : ''}" onclick="toggleChartSeries('${s.id}')">
            <span class="series-swatch" style="background:${s.color}"></span>
            <span>${escapeHtml(s.name)}</span>
          </button>
        `).join('');

      const days = appData.day_tabs;
      const activeSeries = CHART_SERIES_META.filter(s => s.on);

      // Extract scaled values per day for each series
      const seriesPoints = activeSeries.map(s => {
        const pts = days.map(d => {
          const opt = (d.alternative_options || []).find(a => a.id === s.id);
          if (s.id === 'model_v2') {
            return opt ? scaled(opt.value) : null;
          }
          const rawVal = opt ? opt.value : (s.id === 'model' ? d.portfolio.total_value : d.portfolio.starting_capital);
          return scaled(rawVal);
        });
        return { ...s, pts };
      });

      let minV = scaled(6950);
      let maxV = scaled(7050);
      seriesPoints.forEach(s => {
        s.pts.forEach(v => {
          if (v !== null && v !== undefined && !isNaN(v)) {
            if (v < minV) minV = v;
            if (v > maxV) maxV = v;
          }
        });
      });
      const padRange = Math.max((maxV - minV) * 0.14, scaled(18));
      minV -= padRange;
      maxV += padRange;

      const W = 920, H = 290, padL = 74, padR = 24, padT = 22, padB = 34;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;

      const getX = i => days.length <= 1 ? padL + plotW / 2 : padL + (i / (days.length - 1)) * plotW;
      const getY = v => padT + plotH - ((v - minV) / (maxV - minV)) * plotH;

      let out = '';

      // Horizontal grid lines + dollar axis labels
      const gridSteps = 4;
      for (let g = 0; g <= gridSteps; g++) {
        const val = minV + (g / gridSteps) * (maxV - minV);
        const y = getY(val);
        out += `
          <line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" stroke="var(--chart-grid)" stroke-width="1" />
          <text x="${padL - 10}" y="${(y + 4).toFixed(1)}" fill="var(--text-muted)" font-size="11.5" font-family="var(--font-mono)" text-anchor="end">${fmtMoney(val)}</text>
        `;
      }

      // Highlight vertical marker for the currently selected day tab
      if (typeof upToDayIdx === 'number' && upToDayIdx >= 0 && upToDayIdx < days.length) {
        const selX = getX(upToDayIdx);
        out += `<line x1="${selX.toFixed(1)}" y1="${padT}" x2="${selX.toFixed(1)}" y2="${H - padB}" stroke="var(--accent-primary)" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.65" />`;
      }

      // X-axis date labels
      days.forEach((d, i) => {
        const x = getX(i);
        out += `<text x="${x.toFixed(1)}" y="${H - 10}" fill="var(--text-muted)" font-size="11.5" font-family="var(--font-mono)" text-anchor="middle">${d.date.slice(5)}</text>`;
      });

      // Draw each active line + dots
      seriesPoints.forEach(s => {
        const validPts = s.pts.map((v, i) => ({ v, i })).filter(p => p.v !== null && p.v !== undefined && !isNaN(p.v));
        if (validPts.length === 0) return;

        if (validPts.length === 1) {
          // Model v2.0 Live Fork Launch marker
          const p = validPts[0];
          const cx = getX(p.i).toFixed(1);
          const cy = getY(p.v).toFixed(1);
          out += `
            <circle cx="${cx}" cy="${cy}" r="6" fill="${s.color}" stroke="#ffffff" stroke-width="2" />
            <circle cx="${cx}" cy="${cy}" r="11" fill="none" stroke="${s.color}" stroke-width="1.6" opacity="0.7">
              <animate attributeName="r" values="6;14;6" dur="2.4s" repeatCount="indefinite" />
              <animate attributeName="opacity" values="0.8;0.0;0.8" dur="2.4s" repeatCount="indefinite" />
            </circle>
            <text x="${cx}" y="${(getY(p.v) - 13).toFixed(1)}" fill="${s.color}" font-size="11" font-weight="700" font-family="var(--font-mono)" text-anchor="middle">v2.0 Fork Launch</text>
          `;
          return;
        }

        const dPath = validPts.map((p, idx) => `${idx === 0 ? 'M' : 'L'} ${getX(p.i).toFixed(1)} ${getY(p.v).toFixed(1)}`).join(' ');
        const dashAttr = s.dashed ? 'stroke-dasharray="5,4"' : '';
        out += `<path d="${dPath}" fill="none" stroke="${s.color}" stroke-width="${s.width}" ${dashAttr} stroke-linecap="round" stroke-linejoin="round" />`;
        validPts.forEach(p => {
          const r = (s.id === 'model_v2' || s.id === 'model') ? 4.2 : 2.8;
          out += `<circle cx="${getX(p.i).toFixed(1)}" cy="${getY(p.v).toFixed(1)}" r="${r}" fill="${s.color}" />`;
        });
      });

      // Dynamic hover crosshair line
      out += `<line id="chartHoverLine" x1="0" y1="${padT}" x2="0" y2="${H - padB}" stroke="var(--text-muted)" stroke-width="1" style="display:none" />`;

      svg.innerHTML = out;

      // Attach interactive mouse/touch hover scrubbing
      const hoverLine = document.getElementById('chartHoverLine');
      function handleMove(clientX) {
        const rect = svg.getBoundingClientRect();
        const relX = ((clientX - rect.left) / rect.width) * W;
        let bestIdx = 0;
        let bestDist = Infinity;
        days.forEach((_, i) => {
          const dist = Math.abs(getX(i) - relX);
          if (dist < bestDist) { bestDist = dist; bestIdx = i; }
        });
        const snapX = getX(bestIdx);
        if (hoverLine) {
          hoverLine.setAttribute('x1', snapX);
          hoverLine.setAttribute('x2', snapX);
          hoverLine.style.display = 'block';
        }
        if (tooltip) {
          const dayObj = days[bestIdx];
          const rows = seriesPoints
            .map(s => ({ name: s.name, color: s.color, val: s.pts[bestIdx] }))
            .filter(r => r.val !== null && r.val !== undefined && !isNaN(r.val))
            .sort((a, b) => b.val - a.val);
          tooltip.innerHTML = `
            <div class="chart-tooltip-date">Day ${dayObj.day_index} • ${dayObj.date}</div>
            ${rows.map(r => `
              <div class="chart-tooltip-row">
                <span style="display:inline-flex;align-items:center;gap:6px;color:var(--text-secondary);">
                  <span style="width:8px;height:8px;border-radius:50%;background:${r.color};display:inline-block;"></span>
                  ${escapeHtml(r.name)}
                </span>
                <strong class="mono" style="color:var(--text-primary);">${fmtMoney(r.val)}</strong>
              </div>
            `).join('')}
          `;
          tooltip.style.display = 'block';
          const placeRight = snapX < W * 0.55;
          tooltip.style.left = placeRight ? 'auto' : '16px';
          tooltip.style.right = placeRight ? '16px' : 'auto';
        }
      }

      svg.onmousemove = e => handleMove(e.clientX);
      svg.ontouchmove = e => { if (e.touches && e.touches[0]) handleMove(e.touches[0].clientX); };
      svg.onmouseleave = () => {
        if (hoverLine) hoverLine.style.display = 'none';
        if (tooltip) tooltip.style.display = 'none';
      };
    }

    function describeTradeOutcomePlainEnglish(rec, currentTabDate) {
      const act = normalizeActionType(rec.action);
      const isToday = rec.date === currentTabDate;
      const outPct = Number(rec.outcome_pct !== undefined ? rec.outcome_pct : (rec.change_pct || 0));
      const outDollars = rec.outcome_dollars !== undefined ? scaled(rec.outcome_dollars) : scaled((rec.rec_dollars || 0) * (outPct / 100.0));

      if (isToday && Math.abs(outPct) < 0.01) {
        return {
          cls: 'new',
          isWin: null,
          title: `🆕 Executed Today at Close (${fmtMoney(rec.rec_price)})`,
          detail: act === 'BUY'
            ? `Bought at today's 4:00 PM closing price. Real-world profit/loss tracking starts tomorrow.`
            : act === 'STOP_LOSS'
            ? `Stopped out today at ${fmtMoney(rec.rec_price)} to move ${fmtMoney(scaled(rec.rec_dollars))} back into protected cash.`
            : act === 'EXIT'
            ? `Exited position today at ${fmtMoney(rec.rec_price)} to move ${fmtMoney(scaled(rec.rec_dollars))} into cash defense.`
            : act === 'TRIM'
            ? `Sold shares today at ${fmtMoney(rec.rec_price)} to move ${fmtMoney(scaled(rec.rec_dollars))} back into cash.`
            : act === 'FORK'
            ? `Model v2.0 live fork launched at ${fmtMoney(scaled(rec.rec_dollars))} with stop-losses active.`
            : `Kept existing shares steady through today's close.`
        };
      }

      if (act === 'FORK') {
        return {
          cls: 'win',
          isWin: true,
          title: `⚡ Model v2.0 Live Fork Launch`,
          detail: `Launched from baseline value of ${fmtMoney(scaled(rec.rec_dollars))}. Forward-test running with strict stop-losses and cash shield.`
        };
      }

      if (act === 'STOP_LOSS' || act === 'EXIT') {
        if (outDollars <= 0) {
          const saved = Math.abs(outDollars);
          return {
            cls: 'win',
            isWin: true,
            title: `✅ Stop-Loss Saved ${fmtMoney(saved)}`,
            detail: `Exited at ${fmtMoney(rec.rec_price)}; stock later fell to ${fmtMoney(rec.current_price)} (${fmtPct(outPct)} lower). Stopping out early prevented deeper drawdown!`
          };
        } else {
          return {
            cls: 'loss',
            isWin: false,
            title: `🛡️ Disciplined Risk Exit (${fmtMoney(rec.rec_price)})`,
            detail: `Sold at ${fmtMoney(rec.rec_price)} on stop limit; stock later rebounded slightly to ${fmtMoney(rec.current_price)} (+${fmtMoney(outDollars)}). Risk was capped as intended.`
          };
        }
      }

      if (act === 'TRIM') {
        if (outDollars <= 0) {
          const saved = Math.abs(outDollars);
          return {
            cls: 'win',
            isWin: true,
            title: `✅ Smart Sale: Saved ${fmtMoney(saved)}`,
            detail: `Sold at ${fmtMoney(rec.rec_price)}; stock is now ${fmtMoney(rec.current_price)} (${fmtPct(outPct)} lower). Selling early protected ${fmtMoney(saved)}!`
          };
        } else {
          return {
            cls: 'loss',
            isWin: false,
            title: `⚠️ Trimmed Early (Stock Rose ${fmtPct(outPct)})`,
            detail: `Sold at ${fmtMoney(rec.rec_price)} to lock in safety; stock later climbed to ${fmtMoney(rec.current_price)} (+${fmtMoney(outDollars)}).`
          };
        }
      }

      if (act === 'HOLD') {
        const up = outDollars >= 0;
        return {
          cls: up ? 'win' : '',
          isWin: up,
          title: `${up ? '✅ Steady Hold' : '↔ Held Through Dip'}: ${fmtMoney(outDollars, true)} (${fmtPct(outPct)})`,
          detail: `Was ${fmtMoney(rec.rec_price)} when held → Now ${fmtMoney(rec.current_price)}.`
        };
      }

      // Standard BUY
      if (outDollars >= 0) {
        return {
          cls: 'win',
          isWin: true,
          title: `✅ Winning Buy: ${fmtMoney(outDollars, true)} (${fmtPct(outPct)})`,
          detail: `Bought at ${fmtMoney(rec.rec_price)} → Now ${fmtMoney(rec.current_price)}. Earned ${fmtMoney(outDollars)} more than leaving cash idle.`
        };
      } else {
        return {
          cls: 'loss',
          isWin: false,
          title: `❌ Losing Buy So Far: ${fmtMoney(outDollars, true)} (${fmtPct(outPct)})`,
          detail: `Bought at ${fmtMoney(rec.rec_price)} → Now ${fmtMoney(rec.current_price)}. Keeping cash would have saved ${fmtMoney(Math.abs(outDollars))}.`
        };
      }
    }

                : act === 'TRIM' ? '🟠 Sold / Trimmed'
                : '🔵 Held Steady';
              const verbTitle = act === 'STOP_LOSS'
                ? `Stopped Out ${fmtMoney(scaled(a.rec_dollars))} of ${a.name} (${a.ticker})`
                : act === 'EXIT'
                ? `Exited ${fmtMoney(scaled(a.rec_dollars))} of ${a.name} (${a.ticker}) into Cash`
                : act === 'FORK'
                ? `Launched Model v2.0 Live Fork at ${fmtMoney(scaled(a.rec_dollars))}`
                : act === 'BUY'

                : act === 'TRIM'

                : `Kept ${fmtMoney(scaled(a.rec_dollars))} in ${a.name} (${a.ticker})`;
              const sh = Number(a.shares || 0) * capitalScale;

    function buildTradeScorecardAndHistory(tab) {
      const recs = getActiveRecommendations(tab);
      const p = getActivePortfolio(tab);
      let evaluatedCount = 0;
      let winCount = 0;
      let trimSavedDollars = 0;
      let bestBuy = null;
      let worstBuy = null;

      const enriched = recs.map(r => {
        const act = normalizeActionType(r.action);
        const out = describeTradeOutcomePlainEnglish(r, tab.date);
        const outPct = Number(r.outcome_pct !== undefined ? r.outcome_pct : (r.change_pct || 0));
        const outDollars = r.outcome_dollars !== undefined ? scaled(r.outcome_dollars) : scaled((r.rec_dollars || 0) * (outPct / 100.0));
        const rWithOut = { ...r, outcome_dollars: outDollars, outcome_pct: outPct };

        if (out.isWin !== null) {
          evaluatedCount++;
          if (out.isWin) winCount++;
        }
        if ((act === 'TRIM' || act === 'STOP_LOSS' || act === 'EXIT') && outDollars < 0) {
          trimSavedDollars += Math.abs(outDollars);
        }
        if (act === 'BUY' && r.date !== tab.date) {
          if (!bestBuy || outDollars > (bestBuy.outcome_dollars || 0)) bestBuy = rWithOut;
          if (!worstBuy || outDollars < (worstBuy.outcome_dollars || 0)) worstBuy = rWithOut;
        }
        return { raw: rWithOut, act, out };
      });

      const winRatePct = evaluatedCount > 0 ? Math.round((winCount / evaluatedCount) * 100) : 0;

      const filtered = enriched.filter(item => {
        if (tradeFilter === 'buy') return item.act === 'BUY';
        if (tradeFilter === 'trim') return (item.act === 'TRIM' || item.act === 'STOP_LOSS' || item.act === 'EXIT');
        if (tradeFilter === 'win') return item.out.isWin === true;
        if (tradeFilter === 'lag') return item.out.isWin === false;
        return true;
      });

      return `
        <div style="font-size:13px;font-weight:700;color:var(--text-muted);margin-bottom:10px;">

        <div class="scorecard-strip">

            <div class="sc-item-label">Decisions That Helped</div>
            <div class="sc-item-val txt-pos">${winCount} of ${evaluatedCount} (${winRatePct}%)</div>
            <div class="sc-item-sub">${recs.length} total logged moves (${recs.length - evaluatedCount} new today)</div>
          </div>
          <div>
            <div class="sc-item-label">Saved by Stopping Out &amp; Trims</div>
            <div class="sc-item-val ${trimSavedDollars > 0 ? 'txt-pos' : ''}">${fmtMoney(trimSavedDollars, true)}</div>
            <div class="sc-item-sub">Losses avoided by cutting weak/stopped shares</div>
          </div>
          <div>
            <div class="sc-item-label">Best Stock Pick So Far</div>
            <div class="sc-item-val txt-pos">${bestBuy ? `${escapeHtml(bestBuy.ticker)} (${fmtMoney(bestBuy.outcome_dollars, true)})` : '—'}</div>
            <div class="sc-item-sub">${bestBuy ? `${fmtPct(bestBuy.outcome_pct)} since ${bestBuy.date}` : 'Tracking'}</div>
          </div>
          <div>
            <div class="sc-item-label">Biggest Drag So Far</div>
            <div class="sc-item-val ${worstBuy && worstBuy.outcome_dollars < 0 ? 'txt-neg' : ''}">${worstBuy ? `${escapeHtml(worstBuy.ticker)} (${fmtMoney(worstBuy.outcome_dollars, true)})` : '—'}</div>
            <div class="sc-item-sub">${worstBuy ? `${fmtPct(worstBuy.outcome_pct)} since ${worstBuy.date}` : 'None'}</div>
          </div>
        </div>

        <div class="filter-pills">
          <button class="filter-pill ${tradeFilter === 'all' ? 'active' : ''}" onclick="setTradeFilter('all')">All Moves (${enriched.length})</button>

    function renderMiniSparkSvg(sparkArr) {
      if (!sparkArr || sparkArr.length < 2) return '';
      const closes = sparkArr.map(pt => typeof pt === 'object' ? Number(pt.close || 0) : Number(pt || 0));
      const minC = Math.min(...closes);
      const maxC = Math.max(...closes);
      const span = maxC - minC || 1;
      const W = 82, H = 26;
      const pts = closes.map((c, i) => {
        const x = (i / (closes.length - 1)) * W;
        const y = H - 3 - ((c - minC) / span) * (H - 6);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');
      const up = closes[closes.length - 1] >= closes[0];
      const stroke = up ? 'var(--pos)' : 'var(--neg)';
      return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><polyline fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="${pts}" /></svg>`;
    }

      if (Math.abs(diffPct) <= 1) return "Normal Standard Weight";
      if (diffPct > 0) return `Boosted +${diffPct}% (${upWord})`;
      return `Reduced ${diffPct}% (${downWord})`;
    }

                        <td>${escapeHtml(describeMultiplierPlain(al.rel_strength_weight, 'Higher', 'Lower'))}</td>
                        <td class="mono">${Number(al.buy_threshold || 70).toFixed(1)} / 100</td>
                        <td class="${cd !== 'None' ? 'txt-warn' : ''}" style="font-weight:600;">${escapeHtml(cd)}</td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </section>
      `;
    }

    /* ==========================================================================
       PLAIN-ENGLISH STOCK INSPECTOR POPUP MODAL
       ========================================================================== */
    function openStockModal(ticker) {
      if (!ticker || ticker === 'CASH' || !appData) return;
      const tab = typeof selectedView === 'number'
        ? appData.day_tabs[selectedView]
        : appData.day_tabs[appData.day_tabs.length - 1];

      const scored = (tab.watchlist_scores || []).find(s => s.ticker === ticker);
      const holdings = getActiveHoldings(tab);
      const held = holdings.find(h => h.ticker === ticker);
      if (!scored && !held) return;

      const recsV2 = tab.audited_recommendations_v2 || [];
      const isExitedInV2 = (activeModel === 'v2' && !held && recsV2.some(r => r.ticker === ticker && (r.action === 'STOP_LOSS' || r.action === 'EXIT')));

      const name = scored ? scored.name : held.name;
      const sector = scored ? scored.sector : held.sector;
      const price = scored ? scored.price : held.current_price;
      const dayPct = scored ? scored.day_pct : held.day_pct;
      const rsi = scored ? Number(scored.rsi14 || 50) : 50;
      const targetPrice = scored && scored.target_price ? scored.target_price : price * 1.08;
      const stopPrice = scored && scored.stop_price ? scored.stop_price : price * 0.94;
      const spark = (scored && scored.sparkline) || (held && held.sparkline) || [];

      // Build 12-session SVG price chart with optional entry line
      let chartSvg = '';
      if (spark.length >= 2) {
        const closes = spark.map(pt => typeof pt === 'object' ? Number(pt.close || 0) : Number(pt || 0));
        let minP = Math.min(...closes);
        let maxP = Math.max(...closes);
        if (held && held.avg_entry) {
          minP = Math.min(minP, held.avg_entry);
          maxP = Math.max(maxP, held.avg_entry);
        }
        const pad = Math.max((maxP - minP) * 0.15, 0.5);
        minP -= pad; maxP += pad;
        const W = 580, H = 155, pL = 56, pR = 16, pT = 14, pB = 22;
        const cW = W - pL - pR, cH = H - pT - pB;
        const gx = i => pL + (i / (closes.length - 1)) * cW;
        const gy = v => pT + cH - ((v - minP) / (maxP - minP)) * cH;

        const linePts = closes.map((c, i) => `${i === 0 ? 'M' : 'L'} ${gx(i).toFixed(1)} ${gy(c).toFixed(1)}`).join(' ');
        const up12 = closes[closes.length - 1] >= closes[0];
        const col = up12 ? 'var(--pos)' : 'var(--neg)';

        let entryOverlay = '';
        if (held && held.avg_entry) {
          const ey = gy(held.avg_entry);
          entryOverlay = `
            <line x1="${pL}" y1="${ey.toFixed(1)}" x2="${W - pR}" y2="${ey.toFixed(1)}" stroke="var(--accent-primary)" stroke-width="1.5" stroke-dasharray="4,4" />
            <text x="${W - pR - 4}" y="${(ey - 5).toFixed(1)}" fill="var(--accent-primary)" font-size="11" font-family="var(--font-mono)" text-anchor="end">Your Buy Price: ${fmtMoney(held.avg_entry)}</text>
          `;
        }

        chartSvg = `
          <div style="background:var(--bg-card-alt);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:16px;">
            <div style="font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:6px;">Last ${closes.length} Trading Sessions (${fmtMoney(closes[0])} → ${fmtMoney(closes[closes.length - 1])})</div>
            <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:150px;display:block;">
              <text x="${pL - 6}" y="${pT + 8}" fill="var(--text-muted)" font-size="11" font-family="var(--font-mono)" text-anchor="end">${fmtMoney(maxP)}</text>
              <text x="${pL - 6}" y="${pT + cH}" fill="var(--text-muted)" font-size="11" font-family="var(--font-mono)" text-anchor="end">${fmtMoney(minP)}</text>
              ${entryOverlay}
              <path d="${linePts}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
              ${closes.map((c, i) => `<circle cx="${gx(i).toFixed(1)}" cy="${gy(c).toFixed(1)}" r="3" fill="${col}" />`).join('')}
            </svg>
          </div>
        `;
      }

      // Check for matching news headlines scanned today
      const allHeadlines = (tab.gemini_insight && tab.gemini_insight.headlines_scanned) || [];
      const matchingNews = allHeadlines.filter(h => h.includes(`[${ticker}]`));

      // Plain-English 1-month summary
      let monthNarrative = '';
      if (scored) {
        const r20 = Number(scored.ret_20d || 0);
        const rel = Number(scored.rel_strength_20d || 0);
        monthNarrative = `Over the last month (20 trading days), ${name} has moved ${fmtPct(r20)} (${rel >= 0 ? `beating the S&P 500 by ${fmtPct(rel)}` : `trailing the S&P 500 by ${fmtPct(Math.abs(rel), false)}`}). `;
      }

      const modal = document.getElementById('stockModalContent');
      modal.innerHTML = `
        <button class="modal-close" onclick="closeStockModal()">✕</button>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;">
          <span class="t-sym" style="font-size:15px;padding:4px 10px;">${escapeHtml(ticker)}</span>
          <span style="font-size:13px;color:var(--text-muted);font-weight:600;">${escapeHtml(sector)}</span>
        </div>
        <h2 style="font-family:var(--font-heading);font-size:23px;font-weight:800;margin-bottom:4px;">${escapeHtml(name)}</h2>
        <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:16px;">
          <span class="mono" style="font-size:26px;font-weight:700;">${fmtMoney(price)}</span>
          <span class="mono ${dayPct >= 0 ? 'txt-pos' : 'txt-neg'}" style="font-size:14px;">${fmtPct(dayPct)} on ${escapeHtml(tab.date)}</span>
        </div>

        ${held ? `
          <div style="background:var(--bg-highlight);border:1px solid var(--accent-primary-border);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:16px;">
            <div style="font-size:12.5px;font-weight:700;color:var(--accent-primary);margin-bottom:4px;">✓ Currently Inside Your Portfolio (${activeModel === 'v2' ? 'Model 2.0 Active' : 'Model 1.0'})</div>
            <div style="font-size:14px;color:var(--text-primary);">
              You own <strong>${(held.shares * capitalScale).toFixed(3)} shares</strong> worth <strong>${fmtMoney(scaled(held.market_value))}</strong>
              (put in ${fmtMoney(scaled(held.cost_basis))} at ${fmtMoney(held.avg_entry)}/share).
              Current profit/loss: <strong class="${held.pnl_dollars >= 0 ? 'txt-pos' : 'txt-neg'}">${fmtMoney(scaled(held.pnl_dollars), true)} (${fmtPct(held.pnl_pct)})</strong>.
            </div>
          </div>
        ` : (isExitedInV2 ? `
          <div style="background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.3);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:16px;">
            <div style="font-size:12.5px;font-weight:700;color:#ef4444;margin-bottom:4px;">🛑 Exited in Model 2.0 (Strict Risk Discipline)</div>
            <div style="font-size:14px;color:var(--text-primary);">
              Model 2.0 liquidated this position on stop limit to prevent compounding loss and rotated the proceeds into the <strong>tactical cash defense shield</strong>.
            </div>
          </div>
        ` : '')}

        ${chartSvg}

        <div style="background:var(--bg-card-alt);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:16px;">
          <div style="font-size:12.5px;font-weight:700;color:var(--text-muted);margin-bottom:4px;">Plain-English Assessment (AI Score: ${scored ? scored.score.toFixed(1) : held.score.toFixed(1)} / 100)</div>
          <p style="font-size:14px;color:var(--text-primary);line-height:1.55;">
            ${escapeHtml(monthNarrative)}${escapeHtml(translateReasonToPlainEnglish(scored ? scored.reason : held.reason, scored ? scored.signal : held.signal))}
          </p>
        </div>

        <div style="background:var(--bg-card-alt);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:16px;">
          <div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;">
            <span style="color:var(--text-muted)">Price Temperature Gauge</span>
            <span>${escapeHtml(describePriceTemp(rsi))} (RSI ${rsi.toFixed(1)})</span>
          </div>
          <div class="temp-track">
            <div class="temp-thumb" style="left:${Math.max(3, Math.min(97, rsi))}%;"></div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-muted);">
            <span>0 • Deep Bargain</span>
            <span>50 • Normal</span>
            <span>73+ • Overheated</span>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:${matchingNews.length ? '16px' : '0'};">
          <div class="stat-card" style="padding:13px 15px;">
            <div class="stat-label">Profit-Taking Target</div>
            <div class="stat-num txt-pos" style="font-size:20px;">${fmtMoney(targetPrice)}</div>
            <div class="stat-note">Where the model looks to trim &amp; lock in gains</div>
          </div>
          <div class="stat-card" style="padding:13px 15px;">
            <div class="stat-label">Safety Stop-Loss Exit</div>
            <div class="stat-num txt-neg" style="font-size:20px;">${fmtMoney(stopPrice)}</div>
            <div class="stat-note">Guardrail level to cut losses if trend breaks</div>
          </div>
        </div>

        ${matchingNews.length ? `
          <div style="background:var(--bg-card-alt);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:13px 16px;">
            <div style="font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:6px;">Latest News Headlines Scanned by Model:</div>
            ${matchingNews.map(n => `<div style="font-size:13px;color:var(--text-secondary);padding:3px 0;">• ${escapeHtml(n.replace(`[${ticker}] `, ''))}</div>`).join('')}
          </div>
        ` : ''}
      `;

      document.getElementById('stockModalBackdrop').style.display = 'flex';
    }

    function closeStockModal() {
      document.getElementById('stockModalBackdrop').style.display = 'none';
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeStockModal();
    });

    /* ==========================================================================
       BOOT & LIVE DATA LOADER
       ========================================================================== */
    function bootApp() {
      initTheme();
      if (appData && appData.day_tabs && appData.day_tabs.length > 0) {
        selectedView = appData.day_tabs.length - 1;
        renderMarketRibbon();
        renderDayTabs();
        renderCurrentView();
        // Scroll active latest day pill into view horizontally
        const activePill = document.getElementById(`dayPill-${selectedView}`);
        if (activePill) activePill.scrollIntoView({ inline: 'end', block: 'nearest' });
      }
    }

    async function loadFreshDataAndStart() {
      try {
        const resp = await fetch('portfolio_state.json?t=' + Date.now());
        if (resp.ok) {
          const fresh = await resp.json();
          if (fresh && fresh.day_tabs && fresh.day_tabs.length > 0) {
            appData = fresh;
          }
        }
      } catch (err) {
        console.warn('Using bundled portfolio_data.js fallback:', err);
      }
      bootApp();
    }

    loadFreshDataAndStart();
  </script>
</body>
</html>
