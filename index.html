<!DOCTYPE html>
<html lang="en" data-theme="slate">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Market Insight — Plain-English $7,000 Investment Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       1. SOFT MATTE SLATE (DEFAULT CALM DARK MODE — ZERO NEON) & CLEAN LIGHT MODE
       ========================================================================== */
    :root,
    html[data-theme="slate"] {
      --bg-page: #11141b;
      --bg-header: rgba(17, 20, 27, 0.92);
      --bg-ribbon: #151922;
      --bg-card: #181d27;
      --bg-card-alt: #1d2330;
      --bg-card-hover: #222938;
      --bg-highlight: #1e2636;
      --border-subtle: #262e3d;
      --border-strong: #364156;

      --text-primary: #eef1f7;
      --text-secondary: #a5b0c2;
      --text-muted: #737f94;

      --accent-primary: #6b93e8;
      --accent-primary-bg: rgba(107, 147, 232, 0.14);
      --accent-primary-border: rgba(107, 147, 232, 0.32);

      --pos: #3eb481;
      --pos-bg: rgba(62, 180, 129, 0.13);
      --pos-border: rgba(62, 180, 129, 0.30);

      --neg: #e26d67;
      --neg-bg: rgba(226, 109, 103, 0.13);
      --neg-border: rgba(226, 109, 103, 0.30);

      --warn: #dfa247;
      --warn-bg: rgba(223, 162, 71, 0.13);
      --warn-border: rgba(223, 162, 71, 0.30);

      --pill-active-bg: #eef1f7;
      --pill-active-text: #11141b;

      --chart-grid: #252c3b;
      --shadow-card: 0 4px 18px rgba(0, 0, 0, 0.22);
      --shadow-modal: 0 22px 54px rgba(0, 0, 0, 0.55);
    }

    html[data-theme="light"] {
      --bg-page: #f3f5f8;
      --bg-header: rgba(255, 255, 255, 0.94);
      --bg-ribbon: #ebedf2;
      --bg-card: #ffffff;
      --bg-card-alt: #f7f8fb;
      --bg-card-hover: #f0f3f8;
      --bg-highlight: #f2f6fd;
      --border-subtle: #e2e6ef;
      --border-strong: #c8d0df;

      --text-primary: #141821;
      --text-secondary: #4a5568;
      --text-muted: #778296;

      --accent-primary: #2d5ec7;
      --accent-primary-bg: rgba(45, 94, 199, 0.09);
      --accent-primary-border: rgba(45, 94, 199, 0.26);

      --pos: #157a50;
      --pos-bg: #e8f6ef;
      --pos-border: #bfe5d1;

      --neg: #c63d37;
      --neg-bg: #fdeeed;
      --neg-border: #f5c6c4;

      --warn: #a86408;
      --warn-bg: #fef6e6;
      --warn-border: #f6dca8;

      --pill-active-bg: #182032;
      --pill-active-text: #ffffff;

      --chart-grid: #e5e8f0;
      --shadow-card: 0 2px 10px rgba(16, 24, 40, 0.04), 0 1px 3px rgba(16, 24, 40, 0.03);
      --shadow-modal: 0 20px 48px rgba(16, 24, 40, 0.18);
    }

    :root {
      --font-heading: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-pill: 999px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 84px;
      transition: background 0.2s ease, color 0.2s ease;
    }

    button, select {
      font-family: inherit;
    }

    /* ==========================================================================
       2. STICKY TOP BAR, CONTROLS & MARKET RIBBON
       ========================================================================== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 60;
      background: var(--bg-header);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
    }
    .topbar-inner {
      max-width: 1220px;
      margin: 0 auto;
      padding: 13px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--accent-primary-bg);
      border: 1px solid var(--accent-primary-border);
      color: var(--accent-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 15px;
    }
    .brand-name {
      font-family: var(--font-heading);
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: var(--text-primary);
      line-height: 1.15;
    }
    .brand-sub {
      font-size: 12.5px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .control-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
    }
    .control-chip select {
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      outline: none;
    }
    .control-chip select option {
      background: var(--bg-card);
      color: var(--text-primary);
    }
    .toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .toggle-btn:hover {
      border-color: var(--border-strong);
      color: var(--text-primary);
      background: var(--bg-card-hover);
    }
    .toggle-btn.active {
      background: var(--accent-primary-bg);
      border-color: var(--accent-primary-border);
      color: var(--accent-primary);
    }

    .ribbon {
      background: var(--bg-ribbon);
      border-bottom: 1px solid var(--border-subtle);
      padding: 7px 24px;
      overflow-x: auto;
      white-space: nowrap;
    }
    .ribbon-inner {
      max-width: 1220px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 22px;
    }
    .ribbon-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      color: var(--text-secondary);
    }
    .ribbon-name {
      font-weight: 600;
      color: var(--text-primary);
    }
    .ribbon-price {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-secondary);
    }
    .ribbon-chg {
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 5px;
    }
    .ribbon-chg.pos { color: var(--pos); background: var(--pos-bg); }
    .ribbon-chg.neg { color: var(--neg); background: var(--neg-bg); }

    /* ==========================================================================
       3. PAGE CONTAINER & DAY SELECTOR BAR
       ========================================================================== */
    .page-wrap {
      max-width: 1220px;
      margin: 0 auto;
      padding: 20px 24px 0;
    }

    .day-bar-wrap {
      margin-bottom: 26px;
    }
    .day-bar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 9px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .day-bar-label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .updated-stamp {
      font-size: 12px;
      color: var(--text-muted);
    }
    .day-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: thin;
    }
    .day-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 15px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .day-pill:hover {
      border-color: var(--border-strong);
      color: var(--text-primary);
      background: var(--bg-card-hover);
    }
    .day-pill.active {
      background: var(--pill-active-bg);
      color: var(--pill-active-text);
      border-color: var(--pill-active-bg);
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--pos);
      display: inline-block;
    }
    .day-pill.active .live-dot {
      background: #3eb481;
    }

    /* ==========================================================================
       4. CHAPTER / SECTION BLOCKS (SPACIOUS VERTICAL STORYTELLING)
       ========================================================================== */
    .chapter {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 28px 30px;
      margin-bottom: 28px;
      box-shadow: var(--shadow-card);
    }
    .chapter-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--accent-primary);
      margin-bottom: 6px;
    }
    .chapter-title {
      font-family: var(--font-heading);
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -0.35px;
      color: var(--text-primary);
      line-height: 1.3;
    }
    .chapter-desc {
      font-size: 14.5px;
      color: var(--text-secondary);
      margin-top: 5px;
      max-width: 880px;
    }
    .chapter-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    /* Jump Navigation inside Day View */
    .quick-jump {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .jump-link {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .jump-link:hover {
      color: var(--text-primary);
      border-color: var(--border-strong);
      background: var(--bg-card-hover);
    }

    /* ==========================================================================
       5. SECTION 1: EXECUTIVE SUMMARY CARDS & PLAIN-ENGLISH STORY
       ========================================================================== */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin: 22px 0;
    }
    @media (max-width: 960px) {
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 540px) {
      .stat-grid { grid-template-columns: 1fr; }
    }
    .stat-card {
      background: var(--bg-card-alt);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px 18px;
    }
    .stat-label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .stat-num {
      font-family: var(--font-heading);
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-primary);
      line-height: 1.15;
    }
    .stat-note {
      font-size: 13px;
      font-weight: 500;
      margin-top: 7px;
      color: var(--text-secondary);
    }
    .txt-pos { color: var(--pos) !important; font-weight: 600; }
    .txt-neg { color: var(--neg) !important; font-weight: 600; }
    .txt-warn { color: var(--warn) !important; font-weight: 600; }

    .plain-story-box {
      background: var(--bg-highlight);
      border: 1px solid var(--accent-primary-border);
      border-radius: var(--radius-md);
      padding: 20px 22px;
    }
    .plain-story-heading {
      font-family: var(--font-heading);
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .story-bullets {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }
    .story-bullet {
      display: grid;
      grid-template-columns: 26px 1fr;
      gap: 10px;
      align-items: start;
      font-size: 14.5px;
      color: var(--text-primary);
      line-height: 1.55;
    }
    .bullet-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent-primary-bg);
      color: var(--accent-primary);
      font-weight: 700;
      font-size: 12.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }
    .story-bullet strong {
      color: var(--text-primary);
    }

    /* ==========================================================================
       6. SECTION 2: INTERACTIVE CHART & 8-OPTION COMPARISON CARDS
       ========================================================================== */
    .chart-box {
      background: var(--bg-card-alt);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      margin-bottom: 24px;
      position: relative;
    }
    .chart-toggles {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
      align-items: center;
    }
    .series-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 11px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      opacity: 0.55;
      transition: all 0.15s ease;
    }
    .series-pill.on {
      opacity: 1;
      color: var(--text-primary);
      border-color: var(--border-strong);
    }
    .series-swatch {
      width: 11px;
      height: 11px;
      border-radius: 3px;
    }
    .chart-svg-wrap {
      position: relative;
      width: 100%;
    }
    .chart-svg {
      width: 100%;
      height: 290px;
      display: block;
      cursor: crosshair;
    }
    .chart-tooltip {
      position: absolute;
      top: 12px;
      left: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      box-shadow: var(--shadow-card);
      pointer-events: none;
      display: none;
      z-index: 15;
      min-width: 235px;
      font-size: 12.5px;
    }
    .chart-tooltip-date {
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 7px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .chart-tooltip-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 2px 0;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    @media (max-width: 860px) {
      .options-grid { grid-template-columns: 1fr; }
    }
    .option-card {
      background: var(--bg-card-alt);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      transition: border-color 0.15s ease;
    }
    .option-card:hover {
      border-color: var(--border-strong);
    }
    .option-card.is-our-model {
      background: var(--bg-highlight);
      border: 2px solid var(--accent-primary);
    }
    .option-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .option-rank-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .rank-circle {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      font-family: var(--font-mono);
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .rank-circle.top1 {
      background: var(--warn-bg);
      border-color: var(--warn-border);
      color: var(--warn);
    }
    .option-name {
      font-family: var(--font-heading);
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.25;
    }
    .option-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      background: var(--accent-primary-bg);
      color: var(--accent-primary);
      margin-left: 6px;
    }
    .option-money {
      text-align: right;
      flex-shrink: 0;
    }
    .option-val {
      font-family: var(--font-mono);
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .option-chg {
      font-family: var(--font-mono);
      font-size: 12.5px;
      font-weight: 600;
    }
    .option-explain {
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .option-bar-track {
      height: 6px;
      background: var(--bg-card);
      border-radius: 4px;
      overflow: hidden;
    }
    .option-bar-fill {
      height: 100%;
      border-radius: 4px;
    }
    .option-vs-footer {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 6px;
      border-top: 1px solid var(--border-subtle);
    }

    /* ==========================================================================
       7. SECTION 3: TODAY'S MOVES & COMPLETE CHRONOLOGICAL ACTION TRACKER
       ========================================================================== */
    .todays-moves-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }
    .move-card {
      background: var(--bg-card-alt);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .move-card:hover {
      border-color: var(--border-strong);
      background: var(--bg-card-hover);
    }
    .action-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .action-pill.BUY { background: var(--pos-bg); color: var(--pos); border: 1px solid var(--pos-border); }
    .action-pill.TRIM { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-border); }
    .action-pill.HOLD { background: var(--accent-primary-bg); color: var(--accent-primary); border: 1px solid var(--accent-primary-border); }

    .move-headline {
      font-family: var(--font-heading);
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
      margin: 10px 0 6px;
    }
    .move-meta {
      font-family: var(--font-mono);
      font-size: 12.5px;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }
    .move-why {
      font-size: 14px;
      color: var(--text-primary);
      line-height: 1.55;
    }

    .scorecard-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      background: var(--bg-card-alt);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      margin-bottom: 18px;
    }
    @media (max-width: 820px) {
      .scorecard-strip { grid-template-columns: repeat(2, 1fr); }
    }
    .sc-item-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .sc-item-val {
      font-family: var(--font-heading);
      font-size: 18px;
      font-weight: 800;
      color: var(--text-primary);
      margin-top: 2px;
    }
    .sc-item-sub {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .filter-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .filter-pill {
      padding: 6px 13px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-subtle);
      background: var(--bg-card-alt);
      color: var(--text-secondary);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .filter-pill:hover {
      color: var(--text-primary);
      border-color: var(--border-strong);
    }
    .filter-pill.active {
      background: var(--pill-active-bg);
      color: var(--pill-active-text);
      border-color: var(--pill-active-bg);
    }

    .trade-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .trade-row {
      display: grid;
      grid-template-columns: 110px 1fr 250px;
      gap: 16px;
      align-items: center;
      background: var(--bg-card-alt);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .trade-row:hover {
      border-color: var(--border-strong);
      background: var(--bg-card-hover);
    }
    @media (max-width: 860px) {
      .trade-row {
        grid-template-columns: 1fr;
        gap: 10px;
      }
    }
    .trade-date-col {
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: flex-start;
    }
    .trade-date {
      font-family: var(--font-mono);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .trade-main-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 3px;
    }
    .trade-main-why {
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .trade-outcome-box {
      padding: 10px 13px;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      line-height: 1.45;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
    }
    .trade-outcome-box.win {
      background: var(--pos-bg);
      border-color: var(--pos-border);
    }
    .trade-outcome-box.loss {
      background: var(--neg-bg);
      border-color: var(--neg-border);
    }
    .trade-outcome-box.new {
      background: var(--accent-primary-bg);
      border-color: var(--accent-primary-border);
    }
    .trade-outcome-title {
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 2px;
    }

    /* ==========================================================================
       8. SECTION 4: VISUAL ALLOCATION BAR & HOLDINGS TABLE
       ========================================================================== */
    .alloc-stacked-bar {
      display: flex;
      height: 18px;
      width: 100%;
      border-radius: 9px;
      overflow: hidden;
      gap: 2px;
      margin-bottom: 14px;
      background: var(--bg-card-alt);
    }
    .alloc-seg {
      height: 100%;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    .alloc-seg:hover {
      opacity: 0.8;
    }
    .alloc-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 22px;
    }
    .alloc-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--bg-card-alt);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 5px 10px;
      font-size: 12.5px;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }
    .alloc-chip:hover {
      border-color: var(--border-strong);
    }
    .alloc-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }

    .table-scroll {
      overflow-x: auto;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      background: var(--bg-card-alt);
    }
    table.clean-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13.5px;
    }
    table.clean-table th {
      padding: 11px 14px;
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.45px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-card);
      white-space: nowrap;
    }
    table.clean-table td {
      padding: 13px 14px;
      border-bottom: 1px solid var(--border-subtle);
      vertical-align: middle;
    }
    table.clean-table tr:last-child td {
      border-bottom: none;
    }
    table.clean-table tbody tr {
      cursor: pointer;
      transition: background 0.12s ease;
    }
    table.clean-table tbody tr:hover {
      background: var(--bg-card-hover);
    }
    .t-sym {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 13px;
      color: var(--accent-primary);
      background: var(--accent-primary-bg);

      display: inline-block;
    }
    .t-name {
      font-weight: 600;
      color: var(--text-primary);
      margin-left: 6px;
    }
    .t-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
    }
    .mono {
      font-family: var(--font-mono);

    /* ==========================================================================
       9. SECTION 5: AI LEARNING DIARY & WEIGHT CARDS
       ========================================================================== */
    .learning-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    @media (max-width: 900px) {
      .learning-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 540px) {
      .learning-grid { grid-template-columns: 1fr; }
    }
    .learn-card {
      background: var(--bg-card-alt);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 15px 16px;
    }
    .learn-title {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .learn-val {
      font-family: var(--font-heading);
      font-size: 20px;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .learn-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.45;
    }

    .lesson-timeline {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .lesson-item {
      background: var(--bg-card-alt);

      border-radius: var(--radius-md);

    .lesson-date {

      color: var(--accent-primary);

    /* ==========================================================================
       10. STOCK INSPECTOR MODAL (PLAIN-ENGLISH DOSSIER)
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(9, 12, 18, 0.68);
      backdrop-filter: blur(5px);

      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .modal-sheet {
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      max-width: 680px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 26px 28px;
      box-shadow: var(--shadow-modal);
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card-alt);
      color: var(--text-secondary);
      font-size: 16px;
      cursor: pointer;
    }
    .modal-close:hover {
      color: var(--text-primary);
      border-color: var(--border-strong);
    }
    .temp-track {
      height: 10px;
      border-radius: 5px;
      background: linear-gradient(90deg, #3eb481 0%, #6b93e8 50%, #dfa247 75%, #e26d67 100%);
      position: relative;
      margin: 12px 0 6px;
    }
    .temp-thumb {
      position: absolute;
      top: -4px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid #11141b;
      transform: translateX(-50%);
      box-shadow: 0 2px 6px rgba(0,0,0,0.35);
    }

    @media (max-width: 680px) {
      .chapter { padding: 20px 18px; }
      .page-wrap { padding: 16px 14px 0; }
      .topbar-inner { padding: 12px 14px; }
    }
  </style>
</head>
<body>

  <!-- Sticky Top Bar -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark">$7K</div>
        <div>
          <div class="brand-name">Market Insight</div>
          <div class="brand-sub">Plain-English $7,000 Stock Model &amp; Benchmark Tracker</div>
        </div>
      </div>

      <div class="controls-row">
        <div class="control-chip" title="See what your numbers would look like with a different starting investment">
          <span>Starting Amount:</span>
          <select id="capitalScaleSelect" onchange="onCapitalScaleChange()">
            <option value="1000">$1,000</option>
            <option value="7000" selected>$7,000 (Actual)</option>
            <option value="10000">$10,000</option>
            <option value="25000">$25,000</option>
            <option value="50000">$50,000</option>
            <option value="100000">$100,000</option>
          </select>
        </div>

        <button class="toggle-btn" id="mathToggleBtn" onclick="toggleRawMath()" title="Switch between everyday English and raw technical numbers (RSI, 20d/50d moving averages)">
          <span id="mathToggleLabel">🔢 Show Raw Math</span>
        </button>

        <button class="toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Switch between calm Soft Slate dark mode and clean Light mode">
          <span id="themeToggleLabel">☀️ Light Mode</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Live Market Indices Strip -->
  <div class="ribbon">
    <div class="ribbon-inner" id="marketRibbonList"></div>
  </div>

  <!-- Main Content -->
  <main class="page-wrap">
    <div class="day-bar-wrap">
      <div class="day-bar-header">
        <span class="day-bar-label">Pick any trading day to inspect, or view the All-Days Summary:</span>
        <span class="updated-stamp" id="lastUpdatedStamp"></span>
      </div>
      <nav class="day-tabs" id="dayTabsList"></nav>
    </div>

    <div id="dynamicPageContent"></div>
  </main>

  <!-- Plain-English Stock Inspector Modal -->
  <div class="modal-backdrop" id="stockModalBackdrop" onclick="if(event.target===this)closeStockModal()">
    <div class="modal-sheet" id="stockModalContent"></div>
  </div>

  <script src="portfolio_data.js"></script>
  <script>
    /* ==========================================================================
       STATE & PREFERENCES
       ========================================================================== */
    let appData = window.MARKET_INSIGHT_DATA || null;
    let selectedView = 0;       // integer day index, or 'overview', or 'memory'
    let capitalScale = 1.0;
    let showRawMath = false;
    let tradeFilter = 'all';    // 'all' | 'buy' | 'trim' | 'win' | 'lag'
    let watchFilter = 'all';    // 'all' | 'BUY' | 'HOLD' | 'TRIM'

    // Active series on the head-to-head chart (all 8 toggleable!)
    const CHART_SERIES_META = [
      { id: 'model',           name: 'Our AI Model',              color: '#6b93e8', width: 3.4, on: true },
      { id: 'schd_dividend',   name: 'Dividend Value (SCHD)',     color: '#3eb481', width: 2.2, on: true },
      { id: 'spy_mutual',      name: 'S&P 500 Index (SPY)',       color: '#dfa247', width: 2.2, on: true },
      { id: 'balanced_60_40',  name: '60/40 Balanced Fund',       color: '#a78bfa', width: 2.0, on: true },
      { id: 'hysa_cash',       name: '4.5% High-Yield Savings',   color: '#94a3b8', width: 1.8, on: true, dashed: true },
      { id: 'qqq_growth',      name: 'Tech Growth (QQQ)',         color: '#38bdf8', width: 1.9, on: false },
      { id: 'gold_fund',       name: 'Gold Bullion (GLD)',        color: '#f59e0b', width: 1.9, on: false },
      { id: 'uninvested_cash', name: '0% Checking Cash',          color: '#64748b', width: 1.4, on: false, dashed: true }
    ];

    const ALLOC_COLORS = [
      '#5b8def', '#3eb481', '#a78bfa', '#dfa247', '#38bdf8',
      '#f472b6', '#fb923c', '#818cf8', '#2dd4bf', '#94a3b8', '#64748b'
    ];

    // Plain-English dictionary explaining each of the 8 investment options
    const OPTION_PLAIN_ENGLISH = {
      model: "Our active stock-picking experiment: splits money across individual stocks & ETFs, trims positions when they overheat or break down, and holds spare cash.",
      schd_dividend: "A low-fee fund (like Schwab SCHD) that owns ~100 established, profitable US companies—such as Coca-Cola, Home Depot, and AbbVie—that pay steady cash dividends.",
      qqq_growth: "Tracks the Nasdaq-100 (heavily concentrated in tech giants like Apple, Nvidia, Microsoft, and Amazon). Rises fast in tech rallies, drops harder in tech selloffs.",
      balanced_60_40: "A classic retirement-style mix: 60% in S&P 500 US stocks for growth + 40% in US bonds (AGG) to cushion stock-market drops.",
      spy_mutual: "The standard baseline most investors buy (like Vanguard VFIAX or SPY)—automatically owns a slice of the 500 largest US companies.",
      hysa_cash: "A modern online bank savings account paying 4.50% annual interest. Zero stock-market risk; earns steady interest every single day.",
      uninvested_cash: "Leaving your money sitting in a standard 0% checking account doing nothing. Never drops, never grows.",
      gold_fund: "Tracks physical gold bullion prices (GLD). Investors often use gold as a hedge against inflation, though its price still moves up and down."
    };

    /* ==========================================================================
       FORMATTING & PLAIN-ENGLISH TRANSLATION ENGINE
       ========================================================================== */
    function scaled(val) {
      return Number(val || 0) * capitalScale;
    }

    function baseStartDollars() {
      return Math.round(7000 * capitalScale);
    }

    function fmtMoney(val, showPlus = false) {
      const num = Number(val || 0);
      const sign = num > 0.004 ? (showPlus ? '+' : '') : (num < -0.004 ? '-' : '');
      return sign + '$' + Math.abs(num).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function fmtPct(val, showPlus = true) {
      const num = Number(val || 0);
      const sign = num > 0.004 ? (showPlus ? '+' : '') : '';
      return sign + num.toFixed(2) + '%';
    }

    function normalizeActionType(rawAction) {
      const s = String(rawAction || 'HOLD').toUpperCase();
      if (s.includes('BUY')) return 'BUY';
      if (s.includes('TRIM') || s.includes('SELL')) return 'TRIM';
      return 'HOLD';
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Translates technical Python model strings into natural, conversational English!
    function translateReasonToPlainEnglish(rawReason, rawAction) {
      if (!rawReason) return "Selected based on steady price trend and risk balance.";
      if (showRawMath) return rawReason;

      const act = normalizeActionType(rawAction);
      let s = String(rawReason);
      const parts = [];

      // Check for Trimmed prefix: "Trimmed 40% ($330) at $1373.70 (+8.7% vs entry)"
      const trimMatch = s.match(/Trimmed\s+(\d+%)\s+\(\$[\d,.]+\)\s+at\s+\$([\d,.]+)\s+\(([+-]?[\d.]+)%\s+vs\s+entry\)/i);
      if (trimMatch) {
        const pctSold = trimMatch[1];
        const px = trimMatch[2];
        const vsEntry = parseFloat(trimMatch[3]);
        if (vsEntry >= 0) {
          parts.push(`Sold ${pctSold} of our shares at $${px} to lock in a +${vsEntry.toFixed(1)}% profit`);
        } else {
          parts.push(`Sold ${pctSold} of our shares at $${px} (${vsEntry.toFixed(1)}% below our buy price) to cut risk and prevent a deeper loss`);
        }
      }

      // Trend phrases
      if (/Confirmed uptrend above 20d.*50d/i.test(s)) {
        parts.push(parts.length ? "while the stock is climbing above both its 1-month and 2.5-month averages" : "Climbing steadily above both its 1-month and 2.5-month average prices");
      } else if (/Constructive dip toward 50d support/i.test(s)) {
        parts.push(parts.length ? "after a mild pullback toward its 2.5-month support floor" : "Pulled back slightly to a calmer price near its 2.5-month average while keeping its broader uptrend intact");
      } else if (/Trading below 50d moving average/i.test(s)) {
        parts.push(parts.length ? "because the stock slipped below its 2.5-month average trend" : "Currently trading below its 2.5-month average price (showing downward pressure)");
      }

      // RSI / Momentum phrases
      if (/Short-term extended \(RSI ([\d.]+)/i.test(s)) {
        parts.push("and a fast recent jump left the price temporarily overheated");
      } else if (/Healthy momentum zone/i.test(s)) {
        parts.push("with a healthy, balanced price temperature (not overheated)");
      } else if (/Attractive swing entry on cooldown/i.test(s)) {
        parts.push("after cooling off to a more reasonable entry price");
      } else if (/Deeply oversold/i.test(s)) {
        parts.push("after heavy selling pushed the stock to a beaten-down level");
      }

      // Relative strength vs S&P 500
      const outMatch = s.match(/Outperforming S&P 500 by \+?([\d.]+)% over 20d/i);
      if (outMatch) {
        parts.push(`and beating the S&P 500 market average by +${outMatch[1]}% over the past month`);
      }
      const lagMatch = s.match(/Lagging S&P 500 \(-?([\d.]+)% over 20d\)/i);
      if (lagMatch) {
        parts.push(`and trailing behind the S&P 500 by ${lagMatch[1]}% over the past month`);
      }

      // Cooldown penalty
      if (/Self-learning cooldown/i.test(s)) {
        parts.push("— currently placed in the AI's cooldown penalty box due to recent losses");
      }

      if (parts.length === 0) {
        return s.replace(/•/g, ' — ');
      }

      let sentence = parts.join(', ').replace(/, —/g, ' —').replace(/, and /g, ' and ');
      sentence = sentence.charAt(0).toUpperCase() + sentence.slice(1);
      if (!sentence.endsWith('.')) sentence += '.';
      return sentence;
    }

    function describePriceTemp(rsi) {
      const v = Number(rsi || 50);
      if (showRawMath) return `RSI ${v.toFixed(1)}`;
      if (v <= 32) return "Deep Bargain / Beaten Down";
      if (v <= 43) return "Cooled Off / Dip Zone";
      if (v <= 66) return "Healthy Normal Price";
      if (v <= 72) return "Warm / Strong Demand";
      return "Overheated / Pricey";
    }

    function describeTrendSimple(s) {
      if (showRawMath) {
        return `20d: ${fmtMoney(s.sma20)} | 50d: ${fmtMoney(s.sma50)}`;
      }
      const p = Number(s.price || 0);
      const m20 = Number(s.sma20 || p);
      const m50 = Number(s.sma50 || p);
      if (p >= m20 && m20 >= m50) return "↗ Steady Uptrend";
      if (p >= m50 && p < m20) return "↔ Mild Pullback in Uptrend";
      if (p >= m20 && p < m50) return "↗ Trying to Recover";
      return "↘ Sliding Below Average";
    }

    function describeWatchVerdict(s, heldSet) {
      const sig = normalizeActionType(s.signal);
      const isHeld = heldSet.has(s.ticker);
      if (sig === 'BUY') {
        return isHeld
          ? { text: "Strong — Already Own", cls: "BUY" }
          : { text: "Top Buy Candidate", cls: "BUY" };
      }
      if (sig === 'HOLD') {
        return isHeld
          ? { text: "Steady — Holding", cls: "HOLD" }
          : { text: "Watching — Fair", cls: "HOLD" };
      }
      if (Number(s.rsi14 || 50) > 72) {
        return { text: "Wait — Too Overheated", cls: "TRIM" };
      }
      return isHeld
        ? { text: "Trim / Reduce Risk", cls: "TRIM" }
        : { text: "Avoiding — Weak Trend", cls: "TRIM" };
    }

    /* ==========================================================================
       THEME & CONTROLS
       ========================================================================== */
    function initTheme() {
      const saved = localStorage.getItem('mi_theme') || 'slate';
      applyTheme(saved);
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('mi_theme', theme);
      const lbl = document.getElementById('themeToggleLabel');
      if (lbl) {
        lbl.textContent = theme === 'slate' ? '☀️ Light Mode' : '🌙 Soft Slate';
      }
    }

    function toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme') || 'slate';
      applyTheme(cur === 'slate' ? 'light' : 'slate');
    }

    function toggleRawMath() {
      showRawMath = !showRawMath;
      const btn = document.getElementById('mathToggleBtn');
      const lbl = document.getElementById('mathToggleLabel');
      if (btn) btn.classList.toggle('active', showRawMath);
      if (lbl) lbl.textContent = showRawMath ? '🗣️ Plain English' : '🔢 Show Raw Math';
      renderCurrentView();
    }

    function onCapitalScaleChange() {
      const sel = Number(document.getElementById('capitalScaleSelect').value || 7000);
      capitalScale = sel / 7000.0;
      renderCurrentView();
    }

    /* ==========================================================================
       RIBBON & TOP DAY SELECTOR
       ========================================================================== */
    function renderMarketRibbon() {
      const el = document.getElementById('marketRibbonList');
      if (!el || !appData || !appData.market_ribbon) return;
      el.innerHTML = appData.market_ribbon.map(item => {
        const up = Number(item.pct || 0) >= 0;
        return `
          <div class="ribbon-item">
            <span class="ribbon-name">${escapeHtml(item.label)}</span>
            <span class="ribbon-price">${Number(item.price || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
            <span class="ribbon-chg ${up ? 'pos' : 'neg'}">${fmtPct(item.pct)}</span>
          </div>
        `;
      }).join('');
    }

    function renderDayTabs() {
      const el = document.getElementById('dayTabsList');
      const stamp = document.getElementById('lastUpdatedStamp');
      if (!el || !appData || !appData.day_tabs) return;
      if (stamp && appData.last_updated) {
        stamp.textContent = `Last automatic update: ${appData.last_updated}`;
      }

      let html = `
        <button class="day-pill ${selectedView === 'overview' ? 'active' : ''}" onclick="selectView('overview')">
          📊 All-Days Summary (${appData.day_tabs.length} Days)
        </button>
        <button class="day-pill ${selectedView === 'memory' ? 'active' : ''}" onclick="selectView('memory')">
          🧠 How the AI Is Learning
        </button>
      `;

      appData.day_tabs.forEach((tab, idx) => {
        const isLatest = idx === appData.day_tabs.length - 1;
        const cleanLabel = isLatest
          ? `Today • ${tab.date.slice(5)} (Latest)`
          : `Day ${tab.day_index} • ${tab.date.slice(5)}`;
        html += `
          <button class="day-pill ${selectedView === idx ? 'active' : ''}" id="dayPill-${idx}" onclick="selectView(${idx})">
            ${isLatest ? '<span class="live-dot"></span>' : ''}
            <span>${escapeHtml(cleanLabel)}</span>
          </button>
        `;
      });

      el.innerHTML = html;
    }

    /* ==========================================================================
       SINGLE DAY PAGE — ALL 5 SPACIOUS PLAIN-ENGLISH CHAPTERS
       ========================================================================== */
    function buildPlainEnglishBullets(tab, dayIdx) {
      const p = tab.portfolio;
      const alts = tab.alternative_options || [];
      const leader = alts[0];
      const modelAlt = alts.find(a => a.is_model) || { rank: 7 };
      const spyAlt = alts.find(a => a.id === 'spy_mutual');
      const startStr = fmtMoney(scaled(p.starting_capital));
      const totalStr = fmtMoney(scaled(p.total_value));
      const dayMoveStr = fmtMoney(scaled(p.day_change_dollars), true);

      // Bullet 1: Where your money stands & how today went vs S&P 500
      let b1 = '';
      if (dayIdx === 0) {
        b1 = `<strong>Day 1 Kickoff (${tab.date}):</strong> We started with <strong>${startStr}</strong> and put <strong>${fmtMoney(scaled(p.invested_value))}</strong> to work across ${(tab.holdings || []).length} initial stocks &amp; index funds while keeping <strong>${fmtMoney(scaled(p.cash_reserve))}</strong> safely on the sidelines as spare cash.`;
      } else {
        const prevTab = appData.day_tabs[dayIdx - 1];
        const spyPrev = prevTab ? prevTab.portfolio.spy_benchmark_value : p.starting_capital;
        const spyTodayMove = p.spy_benchmark_value - spyPrev;
        const beatSpyToday = p.day_change_dollars >= spyTodayMove;
        b1 = `<strong>How your money moved today:</strong> Your portfolio moved <strong>${dayMoveStr} (${fmtPct(p.day_change_pct)})</strong> today to close at <strong>${totalStr}</strong>. By comparison, a standard S&amp;P 500 fund moved <strong>${fmtMoney(scaled(spyTodayMove), true)}</strong> today${beatSpyToday ? ' — meaning our portfolio held up better than the S&amp;P 500 in today\'s session.' : '.'}`;
      }

      // Bullet 2: What the model did today in plain English
      const actions = tab.todays_actions || [];
      let b2 = '';
      if (dayIdx === 0) {
        const names = actions.map(a => `${a.ticker} (${fmtMoney(scaled(a.rec_dollars))})`).join(', ');
        b2 = `<strong>What the model bought on Day 1:</strong> Built a diversified starter portfolio across 7 core and growth names: ${escapeHtml(names)}.`;
      } else if (actions.length === 0) {
        b2 = `<strong>What the model did today:</strong> Made <strong>no trades today</strong> — kept existing positions steady and preserved <strong>${fmtMoney(scaled(p.cash_reserve))}</strong> in spare cash.`;
      } else if (actions.length === 1) {
        const a = actions[0];
        const actType = normalizeActionType(a.action);
        if (actType === 'BUY') {
          b2 = `<strong>Today's move — Bought ${escapeHtml(a.name)} (${escapeHtml(a.ticker)}):</strong> Put <strong>${fmtMoney(scaled(a.rec_dollars))}</strong> of cash into ${escapeHtml(a.ticker)} at <strong>${fmtMoney(a.rec_price)}/share</strong>. In plain English: ${escapeHtml(translateReasonToPlainEnglish(a.reason, a.action)).replace(/^[A-Z]/, c => c.toLowerCase())}`;
        } else if (actType === 'TRIM') {
          b2 = `<strong>Today's move — Sold part of ${escapeHtml(a.name)} (${escapeHtml(a.ticker)}):</strong> Trimmed <strong>${fmtMoney(scaled(a.rec_dollars))}</strong> at <strong>${fmtMoney(a.rec_price)}/share</strong>. ${escapeHtml(translateReasonToPlainEnglish(a.reason, a.action))}`;
        } else {
          b2 = `<strong>Today's move — Held steady (no new buys or sales):</strong> Kept our top conviction position in <strong>${escapeHtml(a.name)} (${escapeHtml(a.ticker)})</strong> rather than trading just for the sake of trading.`;
        }
      } else {
        const summaries = actions.map(a => {
          const t = normalizeActionType(a.action);
          if (t === 'BUY') return `bought <strong>${fmtMoney(scaled(a.rec_dollars))} of ${escapeHtml(a.ticker)}</strong>`;
          if (t === 'TRIM') return `sold <strong>${fmtMoney(scaled(a.rec_dollars))} of ${escapeHtml(a.ticker)}</strong>`;
          return `held <strong>${escapeHtml(a.ticker)}</strong>`;
        });
        b2 = `<strong>Today's moves (${actions.length} portfolio adjustments):</strong> The model ${summaries.join(', then ')} — freeing up money from overheated or lagging stocks and rotating it into steadier performers. (See full plain-English breakdown in Section 3 below.)`;
      }

      // Bullet 3: Honest plain-English comparison vs passive options + winners/drags
      const holdings = tab.holdings || [];
      const winners = holdings.filter(h => Number(h.pnl_dollars || 0) > 0).sort((a, b) => b.pnl_dollars - a.pnl_dollars);
      const losers = holdings.filter(h => Number(h.pnl_dollars || 0) < 0).sort((a, b) => a.pnl_dollars - b.pnl_dollars);

      let b3 = '';
      if (leader && !leader.is_model) {
        const gap = Math.abs(leader.value - p.total_value);
        const spyGap = spyAlt ? (p.total_value - spyAlt.value) : 0;
        const winText = winners.length > 0
          ? `${winners.length} of your ${holdings.length} current holdings are profitable (led by <strong>${escapeHtml(winners[0].ticker)} ${fmtMoney(scaled(winners[0].pnl_dollars), true)}</strong>)`
          : `your holdings are still settling in`;
        const dragText = losers.length > 0
          ? `, while early tech dips like <strong>${escapeHtml(losers[0].ticker)} (${fmtMoney(scaled(losers[0].pnl_dollars), true)})</strong> have held the total ${spyGap >= 0 ? `${fmtMoney(scaled(spyGap))} ahead of` : `${fmtMoney(scaled(Math.abs(spyGap)))} behind`} the S&amp;P 500.`
          : `.`;
        b3 = `<strong>Why we rank #${modelAlt.rank} of 8 right now:</strong> Steady dividend stocks (<strong>${escapeHtml(leader.name)}</strong>, up ${fmtPct(leader.gain_pct)}) currently lead by ${fmtMoney(scaled(gap))}. Inside our portfolio, ${winText}${dragText}`;
      } else {
        b3 = `<strong>Leaderboard check:</strong> Our model is currently <strong>#1 out of all 8 investment options</strong> at ${totalStr}!`;
      }

      // Optional Bullet 4: Risk Veto (stocks the AI intentionally refused to buy today)
      const cooldowns = (tab.adaptive_learning && tab.adaptive_learning.cooldown_tickers) || [];
      let b4 = '';
      if (cooldowns.length > 0) {

      }

      return [b1, b2, b3, b4].filter(Boolean);
    }

    /* ==========================================================================
       SECTION 2 HELPERS: 8 OPTION CARDS & INTERACTIVE HOVER CHART
       ========================================================================== */
    function buildAll8OptionCards(alts, modelVal, startCap) {
      if (!alts || alts.length === 0) return '';
      const values = alts.map(a => a.value);
      const minV = Math.min(...values, startCap * 0.96);
      const maxV = Math.max(...values, startCap * 1.03);

      return alts.map(a => {
        const up = a.gain_dollars >= 0;
        const barPct = maxV > minV ? Math.max(10, Math.min(100, ((a.value - minV) / (maxV - minV)) * 100)) : 50;
        const barColor = a.is_model ? 'var(--accent-primary)' : (up ? 'var(--pos)' : 'var(--neg)');
        const desc = OPTION_PLAIN_ENGLISH[a.id] || a.subtitle || '';

        let vsLine = '';
        if (a.is_model) {
          vsLine = `<span style="color:var(--accent-primary)">★ This is our active $7,000 experiment</span><span>Rank #${a.rank} of 8</span>`;
        } else {
          const diff = modelVal - a.value; // positive means our model is ahead of this option
          if (Math.abs(diff) < 0.05) {
            vsLine = `<span>Tied with our AI model</span><span>${escapeHtml(a.category || '')}</span>`;
          } else if (diff > 0) {
            vsLine = `<span class="txt-pos">Our AI model is ${fmtMoney(scaled(diff))} ahead of this choice</span><span>${escapeHtml(a.category || '')}</span>`;
          } else {
            vsLine = `<span>This choice is <strong>${fmtMoney(scaled(Math.abs(diff)))} ahead</strong> of our AI model</span><span>${escapeHtml(a.category || '')}</span>`;
          }
        }

        return `
          <div class="option-card ${a.is_model ? 'is-our-model' : ''}">
            <div>
              <div class="option-top">
                <div class="option-rank-wrap">
                  <div class="rank-circle ${a.rank === 1 ? 'top1' : ''}">#${a.rank}</div>
                  <div>
                    <div class="option-name">
                      ${escapeHtml(a.name)}
                      ${a.is_model ? '<span class="option-tag">Our Model</span>' : ''}
                    </div>
                  </div>
                </div>
                <div class="option-money">
                  <div class="option-val">${fmtMoney(scaled(a.value))}</div>
                  <div class="option-chg ${up ? 'txt-pos' : 'txt-neg'}">
                    ${fmtMoney(scaled(a.gain_dollars), true)} (${fmtPct(a.gain_pct)})
                  </div>
                </div>
              </div>
              <p class="option-explain" style="margin-top:8px;">${escapeHtml(desc)}</p>
            </div>

            <div>
              <div class="option-bar-track">
                <div class="option-bar-fill" style="width:${barPct.toFixed(1)}%;background:${barColor};"></div>
              </div>
              <div class="option-vs-footer" style="margin-top:8px;">
                ${vsLine}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleChartSeries(seriesId) {
      const item = CHART_SERIES_META.find(s => s.id === seriesId);
      if (!item) return;
      // Keep at least 1 line visible
      const activeCount = CHART_SERIES_META.filter(s => s.on).length;
      if (item.on && activeCount <= 1) return;
      item.on = !item.on;
      const upToIdx = typeof selectedView === 'number' ? selectedView : appData.day_tabs.length - 1;
      renderInteractiveChart(upToIdx);
    }

    function renderInteractiveChart(upToDayIdx) {
      const pillsEl = document.getElementById('chartSeriesPills');
      const svg = document.getElementById('comparisonChartSvg');
      const tooltip = document.getElementById('chartHoverTooltip');
      if (!svg || !pillsEl || !appData || !appData.day_tabs) return;

      // Render toggle pills
      pillsEl.innerHTML = `<span style="font-size:12px;font-weight:600;color:var(--text-muted);margin-right:4px;">Click to show/hide lines:</span>` +
        CHART_SERIES_META.map(s => `
          <button class="series-pill ${s.on ? 'on' : ''}" onclick="toggleChartSeries('${s.id}')">
            <span class="series-swatch" style="background:${s.color}"></span>
            <span>${escapeHtml(s.name)}</span>
          </button>
        `).join('');

      const days = appData.day_tabs;
      const activeSeries = CHART_SERIES_META.filter(s => s.on);

      // Extract scaled values per day for each series
      const seriesPoints = activeSeries.map(s => {
        const pts = days.map(d => {
          const opt = (d.alternative_options || []).find(a => a.id === s.id);
          const rawVal = opt ? opt.value : (s.id === 'model' ? d.portfolio.total_value : d.portfolio.starting_capital);
          return scaled(rawVal);
        });
        return { ...s, pts };
      });

      let minV = scaled(6950);
      let maxV = scaled(7050);
      seriesPoints.forEach(s => {
        s.pts.forEach(v => {
          if (v < minV) minV = v;
          if (v > maxV) maxV = v;
        });
      });
      const padRange = Math.max((maxV - minV) * 0.14, scaled(18));
      minV -= padRange;
      maxV += padRange;

      const W = 920, H = 290, padL = 74, padR = 24, padT = 22, padB = 34;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;

      const getX = i => days.length <= 1 ? padL + plotW / 2 : padL + (i / (days.length - 1)) * plotW;
      const getY = v => padT + plotH - ((v - minV) / (maxV - minV)) * plotH;

      let out = '';

      // Horizontal grid lines + dollar axis labels
      const gridSteps = 4;
      for (let g = 0; g <= gridSteps; g++) {
        const val = minV + (g / gridSteps) * (maxV - minV);
        const y = getY(val);
        out += `
          <line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" stroke="var(--chart-grid)" stroke-width="1" />
          <text x="${padL - 10}" y="${(y + 4).toFixed(1)}" fill="var(--text-muted)" font-size="11.5" font-family="var(--font-mono)" text-anchor="end">${fmtMoney(val)}</text>
        `;
      }

      // Highlight vertical marker for the currently selected day tab
      if (typeof upToDayIdx === 'number' && upToDayIdx >= 0 && upToDayIdx < days.length) {
        const selX = getX(upToDayIdx);
        out += `<line x1="${selX.toFixed(1)}" y1="${padT}" x2="${selX.toFixed(1)}" y2="${H - padB}" stroke="var(--accent-primary)" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.65" />`;
      }

      // X-axis date labels
      days.forEach((d, i) => {
        const x = getX(i);
        out += `<text x="${x.toFixed(1)}" y="${H - 10}" fill="var(--text-muted)" font-size="11.5" font-family="var(--font-mono)" text-anchor="middle">${d.date.slice(5)}</text>`;
      });

      // Draw each active line + dots
      seriesPoints.forEach(s => {
        const dPath = s.pts.map((v, i) => `${i === 0 ? 'M' : 'L'} ${getX(i).toFixed(1)} ${getY(v).toFixed(1)}`).join(' ');
        const dashAttr = s.dashed ? 'stroke-dasharray="5,4"' : '';
        out += `<path d="${dPath}" fill="none" stroke="${s.color}" stroke-width="${s.width}" ${dashAttr} stroke-linecap="round" stroke-linejoin="round" />`;
        s.pts.forEach((v, i) => {
          const r = s.id === 'model' ? 4.2 : 2.8;
          out += `<circle cx="${getX(i).toFixed(1)}" cy="${getY(v).toFixed(1)}" r="${r}" fill="${s.color}" />`;
        });
      });

      // Dynamic hover crosshair line
      out += `<line id="chartHoverLine" x1="0" y1="${padT}" x2="0" y2="${H - padB}" stroke="var(--text-muted)" stroke-width="1" style="display:none" />`;

      svg.innerHTML = out;

      // Attach interactive mouse/touch hover scrubbing
      const hoverLine = document.getElementById('chartHoverLine');
      function handleMove(clientX) {
        const rect = svg.getBoundingClientRect();
        const relX = ((clientX - rect.left) / rect.width) * W;
        let bestIdx = 0;
        let bestDist = Infinity;
        days.forEach((_, i) => {
          const dist = Math.abs(getX(i) - relX);
          if (dist < bestDist) { bestDist = dist; bestIdx = i; }
        });
        const snapX = getX(bestIdx);
        if (hoverLine) {
          hoverLine.setAttribute('x1', snapX);
          hoverLine.setAttribute('x2', snapX);
          hoverLine.style.display = 'block';
        }
        if (tooltip) {
          const dayObj = days[bestIdx];
          const rows = seriesPoints
            .map(s => ({ name: s.name, color: s.color, val: s.pts[bestIdx] }))
            .sort((a, b) => b.val - a.val);
          tooltip.innerHTML = `
            <div class="chart-tooltip-date">Day ${dayObj.day_index} • ${dayObj.date}</div>
            ${rows.map(r => `
              <div class="chart-tooltip-row">
                <span style="display:inline-flex;align-items:center;gap:6px;color:var(--text-secondary);">
                  <span style="width:8px;height:8px;border-radius:50%;background:${r.color};display:inline-block;"></span>
                  ${escapeHtml(r.name)}
                </span>
                <strong class="mono" style="color:var(--text-primary);">${fmtMoney(r.val)}</strong>
              </div>
            `).join('')}
          `;
          tooltip.style.display = 'block';
          const placeRight = snapX < W * 0.55;
          tooltip.style.left = placeRight ? 'auto' : '16px';
          tooltip.style.right = placeRight ? '16px' : 'auto';
        }
      }

      svg.onmousemove = e => handleMove(e.clientX);
      svg.ontouchmove = e => { if (e.touches && e.touches[0]) handleMove(e.touches[0].clientX); };
      svg.onmouseleave = () => {
        if (hoverLine) hoverLine.style.display = 'none';
        if (tooltip) tooltip.style.display = 'none';
      };
    }

    /* ==========================================================================
       SECTION 3 HELPERS: SELECTED DAY'S MOVES + FULL AUDIT HISTORY
       ========================================================================== */
    function describeTradeOutcomePlainEnglish(rec, currentTabDate) {
      const act = normalizeActionType(rec.action);
      const isToday = rec.date === currentTabDate;
      const outDollars = scaled(rec.outcome_dollars || 0);
      const outPct = Number(rec.outcome_pct || 0);

      if (isToday && Math.abs(outPct) < 0.01) {
        return {
          cls: 'new',
          isWin: null,
          title: `🆕 Executed Today at Close (${fmtMoney(rec.rec_price)})`,
          detail: act === 'BUY'
            ? `Bought at today's 4:00 PM closing price. Real-world profit/loss tracking starts tomorrow.`
            : act === 'TRIM'
            ? `Sold shares today at ${fmtMoney(rec.rec_price)} to move ${fmtMoney(scaled(rec.rec_dollars))} back into cash.`
            : `Kept existing shares steady through today's close.`
        };
      }

      if (act === 'TRIM') {
        // For a TRIM (sale), rec.outcome_dollars = (current_price - rec_price) * shares.
        // If current_price < rec_price (outDollars <= 0), selling SAVED Math.abs(outDollars)!
        if (outDollars <= 0) {
          const saved = Math.abs(outDollars);
          return {
            cls: 'win',
            isWin: true,
            title: `✅ Smart Sale: Saved ${fmtMoney(saved)}`,
            detail: `Sold at ${fmtMoney(rec.rec_price)}; stock is now ${fmtMoney(rec.current_price)} (${fmtPct(outPct)} lower). Selling early protected ${fmtMoney(saved)}!`
          };
        } else {
          return {
            cls: 'loss',
            isWin: false,
            title: `⚠️ Trimmed Early (Stock Rose ${fmtPct(outPct)})`,
            detail: `Sold at ${fmtMoney(rec.rec_price)} to lock in safety; stock later climbed to ${fmtMoney(rec.current_price)} (+${fmtMoney(outDollars)}).`
          };
        }
      }

      if (act === 'HOLD') {
        const up = outDollars >= 0;
        return {
          cls: up ? 'win' : '',
          isWin: up,
          title: `${up ? '✅ Steady Hold' : '↔ Held Through Dip'}: ${fmtMoney(outDollars, true)} (${fmtPct(outPct)})`,
          detail: `Was ${fmtMoney(rec.rec_price)} when held → Now ${fmtMoney(rec.current_price)}.`
        };
      }

      // Standard BUY
      if (outDollars >= 0) {
        return {
          cls: 'win',
          isWin: true,
          title: `✅ Winning Buy: ${fmtMoney(outDollars, true)} (${fmtPct(outPct)})`,
          detail: `Bought at ${fmtMoney(rec.rec_price)} → Now ${fmtMoney(rec.current_price)}. Earned ${fmtMoney(outDollars)} more than leaving cash idle.`
        };
      } else {
        return {
          cls: 'loss',
          isWin: false,
          title: `❌ Losing Buy So Far: ${fmtMoney(outDollars, true)} (${fmtPct(outPct)})`,
          detail: `Bought at ${fmtMoney(rec.rec_price)} → Now ${fmtMoney(rec.current_price)}. Keeping cash would have saved ${fmtMoney(Math.abs(outDollars))}.`
        };
      }
    }

      const enriched = recs.map(r => {

        if (act === 'TRIM' && Number(r.outcome_dollars || 0) < 0) {

        if (act === 'BUY' && r.date !== tab.date) {

          if (!worstBuy || r.outcome_dollars < worstBuy.outcome_dollars) worstBuy = r;

      const filtered = enriched.filter(item => {

    function renderMiniSparkSvg(sparkArr) {
      if (!sparkArr || sparkArr.length < 2) return '';
      const closes = sparkArr.map(pt => typeof pt === 'object' ? Number(pt.close || 0) : Number(pt || 0));
      const minC = Math.min(...closes);
      const maxC = Math.max(...closes);
      const span = maxC - minC || 1;
      const W = 82, H = 26;
      const pts = closes.map((c, i) => {
        const x = (i / (closes.length - 1)) * W;
        const y = H - 3 - ((c - minC) / span) * (H - 6);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');
      const up = closes[closes.length - 1] >= closes[0];
      const stroke = up ? 'var(--pos)' : 'var(--neg)';
      return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><polyline fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="${pts}" /></svg>`;
    }

      const v = Number(w || 1.0);

      const diffPct = Math.round((v - 1.0) * 100);
      if (Math.abs(diffPct) <= 1) return "Normal Standard Weight";
      if (diffPct > 0) return `Boosted +${diffPct}% (${upWord})`;
      return `Reduced ${diffPct}% (${downWord})`;
