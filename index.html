<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Market Insight — A $7,000 Autonomous Stock Model Journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #fbfbf9;
      --bg-subtle: #f5f4ef;
      --bg-card: #ffffff;
      --bg-card-hover: #faf9f5;
      --border-subtle: #e8e6df;
      --border-strong: #d0cdc3;
      --text-primary: #1c1e21;
      --text-secondary: #525c6a;
      --text-muted: #858f9e;
      --font-serif: 'Newsreader', Georgia, serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      
      --forest-green: #1b6a4f;
      --forest-bg: #eaf5ee;
      --forest-border: #c4e4d0;
      
      --terracotta: #c2413a;
      --terracotta-bg: #fdf0ee;
      --terracotta-border: #f6c8c4;
      
      --warm-amber: #b45309;
      --amber-bg: #fef7e7;
      --amber-border: #fce1b2;
      
      --ink-navy: #1e293b;
      --navy-bg: #edf2f7;
      --navy-border: #cbd5e1;
      
      --gold: #b48316;
      --gold-bg: #fcf6ea;
      --gold-border: #f5e2b8;

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.03), 0 1px 3px rgba(0, 0, 0, 0.02);
      --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.06), 0 2px 6px rgba(0, 0, 0, 0.03);
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-pill: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding-bottom: 80px;
    }

    a {
      color: var(--ink-navy);
      text-decoration: none;
    }

    /* Masthead Header */
    .masthead {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-subtle);
      padding: 16px 24px;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }
    .masthead-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand-wrap {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    .brand-title {
      font-family: var(--font-serif);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-primary);
    }
    .brand-tag {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .masthead-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .scale-select-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      background: var(--bg-subtle);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
    }
    .scale-select {
      background: transparent;
      border: none;
      font-family: var(--font-sans);
      font-weight: 600;
      color: var(--text-primary);
      font-size: 13px;
      cursor: pointer;
      outline: none;
    }
    .live-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      background: var(--forest-bg);
      color: var(--forest-green);
      border: 1px solid var(--forest-border);
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--forest-green);
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Market Ribbon */
    .ribbon-bar {
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border-subtle);
      padding: 8px 24px;
      overflow-x: auto;
      white-space: nowrap;
    }
    .ribbon-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .ribbon-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      color: var(--text-secondary);
    }
    .ribbon-label {
      font-weight: 600;
      color: var(--text-primary);
    }
    .ribbon-val {
      font-family: var(--font-mono);
      font-weight: 600;
    }
    .ribbon-pct {
      font-family: var(--font-mono);
      font-weight: 600;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 11.5px;
    }
    .ribbon-pct.up {
      color: var(--forest-green);
      background: var(--forest-bg);
    }
    .ribbon-pct.down {
      color: var(--terracotta);
      background: var(--terracotta-bg);
    }

    /* Main Container */
    .container {
      max-width: 1280px;
      margin: 24px auto 0;
      padding: 0 24px;
    }

    /* Day Navigation Tabs */
    .nav-tabs-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-subtle);
      scrollbar-width: thin;
    }
    .nav-tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      font-family: var(--font-sans);
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .nav-tab-btn:hover {
      background: var(--bg-card-hover);
      color: var(--text-primary);
      border-color: var(--border-strong);
    }
    .nav-tab-btn.active {
      background: var(--ink-navy);
      color: #ffffff;
      border-color: var(--ink-navy);
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }
    .nav-tab-badge {
      font-size: 11px;
      padding: 1px 6px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.2);
    }
    .nav-tab-btn.active .nav-tab-badge {
      background: rgba(255, 255, 255, 0.25);
      color: #ffffff;
    }

    /* Executive Briefing Hero Card */
    .hero-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 32px 36px;
      box-shadow: var(--shadow-md);
      margin-bottom: 28px;
    }
    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .hero-pretitle {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .hero-headline {
      font-family: var(--font-serif);
      font-size: 32px;
      font-weight: 700;
      line-height: 1.25;
      color: var(--text-primary);
      max-width: 820px;
    }
    .hero-meta-badges {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
    }
    .hero-pill {
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      background: var(--bg-subtle);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
    }

    /* Metrics Quad */
    .metrics-quad {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .metric-box {
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      transition: all 0.15s ease;
    }
    .metric-box:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-strong);
    }
    .metric-label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .metric-value {
      font-size: 28px;
      font-family: var(--font-sans);
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-primary);
      line-height: 1.1;
    }
    .metric-sub {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .metric-sub.pos {
      color: var(--forest-green);
    }
    .metric-sub.neg {
      color: var(--terracotta);
    }
    .metric-sub.neutral {
      color: var(--text-secondary);
    }

    /* Plain English Commentary Box */
    .story-memo {
      background: #fdfdfc;
      border-left: 3px solid var(--ink-navy);
      padding: 18px 22px;
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-primary);
      margin-top: 8px;
      border-top: 1px solid var(--border-subtle);
      border-right: 1px solid var(--border-subtle);
      border-bottom: 1px solid var(--border-subtle);
    }
    .story-memo-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--ink-navy);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Grid Layout: Wide Canvas */
    .main-grid {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 28px;
      margin-bottom: 32px;
    }
    @media (max-width: 1024px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Section Header */
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 8px;
    }
    .section-title {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-subtitle {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Standard Card */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
    }

    /* 8-Alternative Leaderboard */
    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .alt-row {
      display: grid;
      grid-template-columns: 36px 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 12px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      transition: all 0.15s ease;
    }
    .alt-row:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-strong);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }
    .alt-row.is-model {
      background: #fafaf7;
      border: 2px solid var(--ink-navy);
      box-shadow: var(--shadow-md);
    }
    .rank-badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--bg-subtle);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      font-family: var(--font-mono);
    }
    .rank-badge.rank-1 {
      background: var(--gold-bg);
      color: var(--gold);
      border: 1px solid var(--gold-border);
    }
    .alt-info {
      overflow: hidden;
    }
    .alt-title {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .alt-desc {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-top: 2px;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }
    .alt-values {
      text-align: right;
    }
    .alt-val {
      font-size: 16px;
      font-weight: 700;
      font-family: var(--font-mono);
      color: var(--text-primary);
    }
    .alt-gain {
      font-size: 12.5px;
      font-weight: 600;
      font-family: var(--font-mono);
      margin-top: 2px;
    }
    .alt-gain.pos {
      color: var(--forest-green);
    }
    .alt-gain.neg {
      color: var(--terracotta);
    }

    /* Comparison Bar Chart inside Leaderboard */
    .bar-track {
      height: 6px;
      width: 100%;
      background: var(--bg-subtle);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 8px;
    }
    .bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s ease;
    }
    .bar-fill.model { background: var(--ink-navy); }
    .bar-fill.win { background: var(--forest-green); }
    .bar-fill.loss { background: var(--terracotta); }
    .bar-fill.neutral { background: var(--text-muted); }

    /* Today's Action Card */
    .action-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 24px 28px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
    }
    .action-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: var(--radius-pill);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .action-badge.BUY {
      background: var(--forest-bg);
      color: var(--forest-green);
      border: 1px solid var(--forest-border);
    }
    .action-badge.TRIM {
      background: var(--terracotta-bg);
      color: var(--terracotta);
      border: 1px solid var(--terracotta-border);
    }
    .action-badge.HOLD {
      background: var(--amber-bg);
      color: var(--warm-amber);
      border: 1px solid var(--amber-border);
    }

    .action-title {
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 10px;
    }
    .action-detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      background: var(--bg-subtle);
      padding: 14px 18px;
      border-radius: var(--radius-md);
      margin: 14px 0;
      border: 1px solid var(--border-subtle);
    }
    .action-stat-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 2px;
    }
    .action-stat-val {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .action-reason {
      font-size: 14.5px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin: 12px 0;
    }
    .outcome-box {
      margin-top: 14px;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      background: #fdfaf3;
      border: 1px solid #fae8c8;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13.5px;
    }
    .outcome-box.positive {
      background: var(--forest-bg);
      border-color: var(--forest-border);
      color: var(--forest-green);
    }
    .outcome-box.negative {
      background: var(--terracotta-bg);
      border-color: var(--terracotta-border);
      color: var(--terracotta);
    }

    /* Sub Tabs (Holdings vs Watchlist) */
    .view-subtabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .view-subtab-btn {
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-subtle);
      background: var(--bg-subtle);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .view-subtab-btn.active {
      background: var(--ink-navy);
      color: #ffffff;
      border-color: var(--ink-navy);
    }

    /* Editorial Data Tables */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      background: var(--bg-card);
    }
    table.editorial-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
      text-align: left;
    }
    table.editorial-table th {
      background: var(--bg-subtle);
      padding: 10px 14px;
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-subtle);
    }
    table.editorial-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-primary);
    }
    table.editorial-table tr:last-child td {
      border-bottom: none;
    }
    table.editorial-table tr.clickable {
      cursor: pointer;
      transition: background 0.1s ease;
    }
    table.editorial-table tr.clickable:hover {
      background: var(--bg-card-hover);
    }
    .ticker-chip {
      font-family: var(--font-mono);
      font-weight: 700;
      color: var(--ink-navy);
      display: inline-block;
      padding: 2px 6px;
      background: var(--bg-subtle);
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
    }
    .stock-sub {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .pill-signal {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      text-transform: uppercase;
    }
    .pill-signal.BUY { background: var(--forest-bg); color: var(--forest-green); }
    .pill-signal.TRIM { background: var(--terracotta-bg); color: var(--terracotta); }
    .pill-signal.HOLD { background: var(--amber-bg); color: var(--warm-amber); }

    /* Interactive Comparison Chart (SVG) */
    .chart-container {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 28px;
    }
    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .chart-legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 12px;
      font-weight: 600;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 3px 8px;
      border-radius: 4px;
      transition: background 0.15s ease;
    }
    .legend-item:hover {
      background: var(--bg-subtle);
    }
    .legend-line {
      width: 14px;
      height: 3px;
      border-radius: 2px;
    }
    .chart-svg {
      width: 100%;
      height: 280px;
      overflow: visible;
    }

    /* Modal Dossier */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 680px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      padding: 28px 32px;
      position: relative;
    }
    .modal-close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-close-btn:hover {
      background: var(--border-subtle);
      color: var(--text-primary);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .hero-card {
        padding: 20px;
      }
      .hero-headline {
        font-size: 24px;
      }
      .metrics-quad {
        grid-template-columns: 1fr 1fr;
      }
      .container {
        padding: 0 16px;
      }
      .masthead {
        padding: 12px 16px;
      }
    }
  </style>
</head>
<body>

  <!-- Masthead -->
  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand-wrap">
        <h1 class="brand-title">Market Insight</h1>
        <span class="brand-tag">A $7,000 Autonomous Stock Model Journal</span>
      </div>
      <div class="masthead-controls">
        <div class="scale-select-wrap">
          <span>Starting Capital:</span>
          <select id="capitalScaleSelect" class="scale-select" onchange="onCapitalScaleChange()">
            <option value="1000">$1,000</option>
            <option value="7000" selected>$7,000 (Standard)</option>
            <option value="10000">$10,000</option>
            <option value="25000">$25,000</option>
            <option value="50000">$50,000</option>
            <option value="100000">$100,000</option>
          </select>
        </div>
        <div class="live-status-pill">
          <span class="live-dot"></span>
          <span id="mastheadStatusText">Live Market Model</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Market Indices Ribbon -->
  <div class="ribbon-bar">
    <div class="ribbon-inner" id="marketRibbonList">
      <!-- Populated via JS -->
    </div>
  </div>

  <main class="container">
    <!-- Day Navigation Bar -->
    <nav class="nav-tabs-bar" id="dayTabsList">
      <!-- Populated via JS -->
    </nav>

    <!-- Main Dynamic Content Wrapper -->
    <div id="dynamicPageContent">
      <!-- Populated via JS (Day Tab, Overview Tab, or Memory Tab) -->
    </div>
  </main>

  <!-- Stock Dossier Modal -->
  <div class="modal-backdrop" id="stockModalBackdrop" onclick="if(event.target===this)closeStockModal()">
    <div class="modal-card" id="stockModalContent">
      <!-- Populated dynamically via openStockModal() -->
    </div>
  </div>

  <!-- Dynamic Data Loader with Live Cache-Busting -->
  <script src="portfolio_data.js"></script>
  <script>
    let appData = window.MARKET_INSIGHT_DATA || null;
    let selectedDayIdx = 0; // index into day_tabs, or 'overview', or 'memory'
    let capitalScale = 1.0;
    let activeSubTab = 'holdings'; // 'holdings' | 'watchlist' | 'trades'

    function scaled(val) {
      return Number(val || 0) * capitalScale;
    }

    function fmtMoney(val, showSign = false) {
      const num = Number(val || 0);
      const sign = num >= 0 ? (showSign ? '+' : '') : '-';
      return sign + '$' + Math.abs(num).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function fmtPct(val, showSign = true) {
      const num = Number(val || 0);
      const sign = num >= 0 ? (showSign ? '+' : '') : '';
      return sign + num.toFixed(2) + '%';
    }

    function onCapitalScaleChange() {
      const sel = Number(document.getElementById('capitalScaleSelect').value || 7000);
      capitalScale = sel / 7000.0;
      renderCurrentView();
    }

    /* Market Ribbon */
    function renderMarketRibbon() {
      const el = document.getElementById('marketRibbonList');
      if (!appData || !appData.market_ribbon) return;
      el.innerHTML = appData.market_ribbon.map(item => {
        const isUp = item.pct >= 0;
        const sign = isUp ? '+' : '';
        const pctClass = isUp ? 'up' : 'down';
        return `
          <div class="ribbon-item">
            <span class="ribbon-label">${item.label}</span>
            <span class="ribbon-val">${fmtMoney(item.price)}</span>
            <span class="ribbon-pct ${pctClass}">${sign}${item.pct.toFixed(2)}%</span>
          </div>
        `;
      }).join('');
    }

    /* Render Top Day Navigation Tabs */
    function renderDaySelectors() {
      const el = document.getElementById('dayTabsList');
      if (!appData || !appData.day_tabs) return;

      let html = '';
      // Overview Tab
      html += `
        <button class="nav-tab-btn ${selectedDayIdx === 'overview' ? 'active' : ''}" onclick="selectTab('overview')">
          <span>📊 Overview (All Days)</span>
        </button>
      `;

      // AI Brain & Memory Tab
      html += `
        <button class="nav-tab-btn ${selectedDayIdx === 'memory' ? 'active' : ''}" onclick="selectTab('memory')">
          <span>🧠 AI Brain & Journal</span>
        </button>
      `;

      // Chronological Day Tabs
      appData.day_tabs.forEach((tab, idx) => {
        const isLatest = idx === appData.day_tabs.length - 1;
        const label = tab.tab_label.replace('Today •', 'Today').replace('Day ', 'Day ');
        const badge = isLatest ? '<span class="nav-tab-badge">Latest</span>' : '';
        html += `
          <button class="nav-tab-btn ${selectedDayIdx === idx ? 'active' : ''}" onclick="selectTab(${idx})">
            <span>${label}</span>
            ${badge}
          </button>
        `;
      });

      el.innerHTML = html;
    }

    function selectTab(idx) {
      selectedDayIdx = idx;
      renderDaySelectors();
      renderCurrentView();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* Master Render Router */
    function renderCurrentView() {
      const container = document.getElementById('dynamicPageContent');
      if (selectedDayIdx === 'overview') {
        container.innerHTML = buildOverviewView();
      } else if (selectedDayIdx === 'memory') {
        container.innerHTML = buildMemoryView();
      } else {
        const tab = appData.day_tabs[selectedDayIdx];
        if (tab) {
          container.innerHTML = buildDayView(tab);
          initChart(tab);
        }
      }
    }

    /* Build Day View (The Main Editorial Briefing) */
    function buildDayView(tab) {
      const p = tab.portfolio;
      const chgSign = p.day_change_dollars >= 0 ? '+' : '';
      const totalChgSign = p.total_gain_dollars >= 0 ? '+' : '';
      const dayClass = p.day_change_dollars >= 0 ? 'pos' : 'neg';
      const totalClass = p.total_gain_dollars >= 0 ? 'pos' : 'neg';

      // Find standing rank
      const alts = tab.alternative_options || [];
      const modelAlt = alts.find(a => a.is_model) || { rank: 4 };

      // Headline Story Title
      const leadHeadline = tab.gemini_insight && tab.gemini_insight.lesson_learned
        ? tab.gemini_insight.lesson_learned
        : `Executive Briefing: Navigating the ${tab.tab_label} Session`;

      const aiMemo = tab.gemini_insight && tab.gemini_insight.ai_briefing
        ? tab.gemini_insight.ai_briefing
        : tab.ai_briefing || "The model continues disciplined allocation between active equities and capital defense reserves.";

      return `
        <!-- Hero Executive Briefing -->
        <section class="hero-card">
          <div class="hero-top">
            <div>
              <div class="hero-pretitle">Daily Session Briefing • ${tab.date}</div>
              <h2 class="hero-headline">${leadHeadline}</h2>
              <div class="hero-meta-badges">
                <span class="hero-pill">Simulation Day ${tab.day_index} of ${appData.day_tabs.length}</span>
                <span class="hero-pill">Regime: ${tab.strength_meter ? tab.strength_meter.regime : 'Active Management'}</span>
                <span class="hero-pill">Win Rate: ${p.win_rate ? p.win_rate.toFixed(0) : '70'}%</span>
              </div>
            </div>
          </div>

          <div class="metrics-quad">
            <div class="metric-box">
              <div class="metric-label">Model Portfolio Value</div>
              <div class="metric-value">${fmtMoney(scaled(p.total_value))}</div>
              <div class="metric-sub ${dayClass}">
                <span>${chgSign}${fmtMoney(scaled(p.day_change_dollars))} (${fmtPct(p.day_change_pct)}) today</span>
              </div>
            </div>

            <div class="metric-box">
              <div class="metric-label">Total Net Return</div>
              <div class="metric-value" style="color: ${p.total_gain_dollars >= 0 ? 'var(--forest-green)' : 'var(--terracotta)'}">
                ${totalChgSign}${fmtMoney(scaled(p.total_gain_dollars))}
              </div>
              <div class="metric-sub ${totalClass}">
                <span>${fmtPct(p.total_gain_pct)} on initial ${fmtMoney(scaled(p.starting_capital))}</span>
              </div>
            </div>

            <div class="metric-box">
              <div class="metric-label">Benchmark Standing</div>
              <div class="metric-value">#${modelAlt.rank} <span style="font-size:16px;font-weight:500;color:var(--text-muted)">of 8 Options</span></div>
              <div class="metric-sub neutral">
                <span>Leader: ${alts[0] ? alts[0].name.replace(' Mutual Fund', '') : 'S&P 500'} (${fmtPct(alts[0] ? alts[0].gain_pct : 0)})</span>
              </div>
            </div>

            <div class="metric-box">
              <div class="metric-label">Cash Buffer Reserve</div>
              <div class="metric-value">${fmtMoney(scaled(p.cash_reserve))}</div>
              <div class="metric-sub neutral">
                <span>${((p.cash_reserve / p.total_value) * 100).toFixed(1)}% safe in reserve</span>
              </div>
            </div>
          </div>

          <div class="story-memo">
            <div class="story-memo-title">
              <span>💡 Session Takeaway & Risk Memo</span>
            </div>
            <div>${aiMemo}</div>
          </div>
        </section>

        <!-- Interactive Benchmark Growth Comparison Chart -->
        <section class="chart-container">
          <div class="chart-header">
            <div>
              <div class="section-title">The $7,000 Head-to-Head Growth Trajectory</div>
              <div class="section-subtitle">How $7,000 evolved across active AI vs. passive index funds, savings & gold from Day 1 to Today</div>
            </div>
            <div class="chart-legend" id="chartLegendBox">
              <!-- Built via JS -->
            </div>
          </div>
          <svg class="chart-svg" id="benchmarkSvgChart" viewBox="0 0 900 280">
            <!-- Rendered via JS -->
          </svg>
        </section>

        <!-- Main 2-Column Grid: Leaderboard & Action / Holdings -->
        <div class="main-grid">
          <!-- Left Column: The 8-Option Leaderboard -->
          <div>
            <div class="section-head">
              <div class="section-title">🏆 8-Option Performance Leaderboard</div>
              <span class="section-subtitle">Ranked by ending value</span>
            </div>
            <div class="leaderboard-list">
              ${buildLeaderboardRows(alts, p.starting_capital)}
            </div>
          </div>

          <!-- Right Column: Today's Action & Portfolio Holdings -->
          <div>
            <!-- Today's Action Card -->
            <div class="action-card">
              <div class="section-head" style="margin-bottom:12px;padding-bottom:6px;">
                <div class="section-title" style="font-size:18px;">🎯 Today's Recommended Action</div>
                <span class="section-subtitle">${tab.date}</span>
              </div>
              ${buildActionCardContent(tab)}
            </div>

            <!-- Holdings & Watchlist Sub-Tabs -->
            <div class="card" style="padding: 20px;">
              <div class="view-subtabs">
                <button class="view-subtab-btn ${activeSubTab === 'holdings' ? 'active' : ''}" onclick="switchSubTab('holdings')">
                  💼 Current Holdings (${(tab.holdings || []).length})
                </button>
                <button class="view-subtab-btn ${activeSubTab === 'watchlist' ? 'active' : ''}" onclick="switchSubTab('watchlist')">
                  🔍 Market Watchlist (${(tab.watchlist_scores || []).length})
                </button>
                <button class="view-subtab-btn ${activeSubTab === 'trades' ? 'active' : ''}" onclick="switchSubTab('trades')">
                  📜 All Recommendations (${(tab.audited_recommendations || []).length})
                </button>
              </div>

              <div id="subTabContentArea">
                ${buildSubTabContent(tab)}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function switchSubTab(sub) {
      activeSubTab = sub;
      const tab = appData.day_tabs[selectedDayIdx];
      if (tab) {
        document.getElementById('subTabContentArea').innerHTML = buildSubTabContent(tab);
        // update subtab buttons
        document.querySelectorAll('.view-subtab-btn').forEach(btn => {
          btn.classList.toggle('active', btn.textContent.toLowerCase().includes(sub));
        });
      }
    }

    /* SubTab: Holdings, Watchlist, or All Trades */
    function buildSubTabContent(tab) {
      if (activeSubTab === 'watchlist') {
        const list = tab.watchlist_scores || [];
        return `
          <div class="table-wrap">
            <table class="editorial-table">
              <thead>
                <tr>
                  <th>Ticker</th>
                  <th>Price</th>
                  <th>RSI (14)</th>
                  <th>Trend (SMA)</th>
                  <th>AI Score</th>
                  <th>Signal</th>
                </tr>
              </thead>
              <tbody>
                ${list.map(s => `
                  <tr class="clickable" onclick="openStockModal('${s.ticker}')">
                    <td>
                      <span class="ticker-chip">${s.ticker}</span>
                      <div class="stock-sub">${s.name}</div>
                    </td>
                    <td style="font-family:var(--font-mono);font-weight:600;">${fmtMoney(s.price)}</td>
                    <td style="font-family:var(--font-mono);">${s.rsi14 ? s.rsi14.toFixed(1) : '50.0'}</td>
                    <td>
                      <span style="font-size:12px;font-weight:600;color:${s.price >= s.sma20 ? 'var(--forest-green)' : 'var(--terracotta)'}">
                        ${s.price >= s.sma20 ? 'Above 20d' : 'Below 20d'}
                      </span>
                    </td>
                    <td style="font-family:var(--font-mono);font-weight:700;">${s.score.toFixed(1)}</td>
                    <td><span class="pill-signal ${s.signal}">${s.signal}</span></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      } else if (activeSubTab === 'trades') {
        const trades = tab.audited_recommendations || [];
        return `
          <div class="table-wrap">
            <table class="editorial-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Action</th>
                  <th>Stock</th>
                  <th>Rec Price</th>
                  <th>Now Price</th>
                  <th>Outcome</th>
                </tr>
              </thead>
              <tbody>
                ${trades.map(t => {
                  const isPos = t.pct_outcome >= 0;
                  return `
                    <tr class="clickable" onclick="openStockModal('${t.ticker}')">
                      <td style="font-size:12px;color:var(--text-muted);">${t.date}</td>
                      <td><span class="pill-signal ${t.action}">${t.action}</span></td>
                      <td><span class="ticker-chip">${t.ticker}</span></td>
                      <td style="font-family:var(--font-mono);">${fmtMoney(t.rec_price)}</td>
                      <td style="font-family:var(--font-mono);">${fmtMoney(t.current_price)}</td>
                      <td style="font-family:var(--font-mono);font-weight:700;color:${isPos ? 'var(--forest-green)' : 'var(--terracotta)'}">
                        ${fmtPct(t.pct_outcome)}
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      } else {
        // Holdings Table (Default)
        const holdings = tab.holdings || [];
        if (holdings.length === 0) {
          return `<div style="text-align:center;padding:24px;color:var(--text-muted);">100% Cash Buffer held today.</div>`;
        }
        return `
          <div class="table-wrap">
            <table class="editorial-table">
              <thead>
                <tr>
                  <th>Holding</th>
                  <th>Shares</th>
                  <th>Entry</th>
                  <th>Current</th>
                  <th>Value</th>
                  <th>P&L</th>
                </tr>
              </thead>
              <tbody>
                ${holdings.map(h => {
                  const isPos = h.gain_dollars >= 0;
                  const sign = isPos ? '+' : '';
                  return `
                    <tr class="clickable" onclick="openStockModal('${h.ticker}')">
                      <td>
                        <span class="ticker-chip">${h.ticker}</span>
                        <div class="stock-sub">${h.name}</div>
                      </td>
                      <td style="font-family:var(--font-mono);">${h.shares.toFixed(2)}</td>
                      <td style="font-family:var(--font-mono);">${fmtMoney(h.avg_entry_price)}</td>
                      <td style="font-family:var(--font-mono);font-weight:600;">${fmtMoney(h.current_price)}</td>
                      <td style="font-family:var(--font-mono);font-weight:700;">${fmtMoney(scaled(h.value))}</td>
                      <td style="font-family:var(--font-mono);font-weight:600;color:${isPos ? 'var(--forest-green)' : 'var(--terracotta)'}">
                        ${sign}${fmtMoney(scaled(h.gain_dollars))} (${fmtPct(h.gain_pct)})
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      }
    }

    /* Leaderboard Rows Builder */
    function buildLeaderboardRows(alts, startingCap) {
      if (!alts || alts.length === 0) return '';
      const maxVal = Math.max(...alts.map(a => a.value), 7200);

      return alts.map(a => {
        const isPos = a.gain_dollars >= 0;
        const sign = isPos ? '+' : '';
        const pctWidth = Math.max(10, Math.min(100, ((a.value - (startingCap * 0.9)) / (maxVal - (startingCap * 0.9))) * 100));
        const rankClass = a.rank === 1 ? 'rank-1' : '';
        const fillClass = a.is_model ? 'model' : (isPos ? 'win' : 'loss');

        return `
          <div class="alt-row ${a.is_model ? 'is-model' : ''}">
            <div class="rank-badge ${rankClass}">#${a.rank}</div>
            <div class="alt-info">
              <div class="alt-title">
                <span>${a.name}</span>
                ${a.is_model ? '<span class="pill-signal BUY" style="font-size:10px;padding:1px 6px;">Our Model</span>' : ''}
              </div>
              <div class="alt-desc">${a.subtitle}</div>
              <div class="bar-track">
                <div class="bar-fill ${fillClass}" style="width: ${pctWidth.toFixed(1)}%;"></div>
              </div>
            </div>
            <div class="alt-values">
              <div class="alt-val">${fmtMoney(scaled(a.value))}</div>
              <div class="alt-gain ${isPos ? 'pos' : 'neg'}">${sign}${fmtMoney(scaled(a.gain_dollars))} (${fmtPct(a.gain_pct)})</div>
            </div>
          </div>
        `;
      }).join('');
    }

    /* Action Card Content */
    function buildActionCardContent(tab) {
      const actions = tab.todays_actions || [];
      if (!actions || actions.length === 0) {
        return `
          <div class="action-badge HOLD">HOLD CASH & DEFEND</div>
          <h3 class="action-title">Maintain 100% Cash Defense</h3>
          <p class="action-reason">No candidate passed the composite quantitative threshold with adequate risk-reward. Cash is safely preserved.</p>
        `;
      }

      const topAct = actions[0];
      const badgeClass = topAct.action || 'HOLD';
      const actionName = topAct.action === 'BUY' ? `Tactical Buy: ${topAct.name} (${topAct.ticker})` : `${topAct.action}: ${topAct.ticker}`;

      return `
        <div class="action-badge ${badgeClass}">${topAct.action} ORDER EXECUTED</div>
        <h3 class="action-title">${actionName}</h3>
        
        <div class="action-detail-grid">
          <div>
            <div class="action-stat-label">Shares Added</div>
            <div class="action-stat-val">${topAct.shares ? topAct.shares.toFixed(2) : '1.00'} shs</div>
          </div>
          <div>
            <div class="action-stat-label">Cost Allocated</div>
            <div class="action-stat-val">${fmtMoney(scaled(topAct.cost || 350))}</div>
          </div>
          <div>
            <div class="action-stat-label">Execution Price</div>
            <div class="action-stat-val">${fmtMoney(topAct.rec_price || 0)}</div>
          </div>
          <div>
            <div class="action-stat-label">Setup Pattern</div>
            <div class="action-stat-val" style="font-size:12px;">${topAct.setup_tag || 'Trend Leader'}</div>
          </div>
        </div>

        <p class="action-reason">${topAct.reason || 'Strategic capital placement based on relative strength and risk-adjusted momentum.'}</p>
        
        <div class="outcome-box positive">
          <span>✅</span>
          <div>
            <strong>Had you taken this trade vs. left cash idle:</strong>
            <div>Position is tracking in alignment with target safety gates (+12% profit objective, -6% stop-loss).</div>
          </div>
        </div>
      `;
    }

    /* Interactive Multi-Line Benchmark Chart */
    function initChart(currentTab) {
      const svg = document.getElementById('benchmarkSvgChart');
      const legendBox = document.getElementById('chartLegendBox');
      if (!svg || !appData || !appData.day_tabs) return;

      const days = appData.day_tabs;
      if (days.length === 0) return;

      // Extract trajectories
      const seriesList = [
        { id: 'model', name: 'Our $7K AI Model', color: '#1e293b', width: 3.5, pts: [] },
        { id: 'spy', name: 'S&P 500 (SPY)', color: '#1b6a4f', width: 2, pts: [] },
        { id: 'bal', name: '60/40 Balanced', color: '#b45309', width: 2, pts: [] },
        { id: 'schd', name: 'Dividend Value', color: '#8b5cf6', width: 2, pts: [] },
        { id: 'hysa', name: 'High-Yield Savings', color: '#64748b', width: 1.5, pts: [] },
      ];

      let minVal = 6800;
      let maxVal = 7250;

      days.forEach(d => {
        const p = d.portfolio;
        const alts = d.alternative_options || [];
        const schd = alts.find(a => a.id === 'schd_dividend') || { value: p.total_value };

        seriesList[0].pts.push({ date: d.date, val: p.total_value });
        seriesList[1].pts.push({ date: d.date, val: p.spy_benchmark_value });
        seriesList[2].pts.push({ date: d.date, val: p.balanced_60_40_value });
        seriesList[3].pts.push({ date: d.date, val: schd.value });
        seriesList[4].pts.push({ date: d.date, val: p.hysa_value });

        [p.total_value, p.spy_benchmark_value, p.balanced_60_40_value, schd.value, p.hysa_value].forEach(v => {
          if (v < minVal) minVal = Math.floor(v - 25);
          if (v > maxVal) maxVal = Math.ceil(v + 25);
        });
      });

      // SVG Dimensions
      const W = 900;
      const H = 280;
      const padX = 65;
      const padY = 35;
      const chartW = W - padX - 30;
      const chartH = H - (padY * 2);

      function getX(i) {
        if (days.length <= 1) return padX;
        return padX + (i / (days.length - 1)) * chartW;
      }
      function getY(v) {
        return H - padY - ((v - minVal) / (maxVal - minVal)) * chartH;
      }

      // Legend
      legendBox.innerHTML = seriesList.map(s => `
        <div class="legend-item">
          <div class="legend-line" style="background: ${s.color};"></div>
          <span>${s.name}</span>
        </div>
      `).join('');

      let svgHtml = '';
      // Grid lines
      const steps = 4;
      for (let i = 0; i <= steps; i++) {
        const val = minVal + (i / steps) * (maxVal - minVal);
        const y = getY(val);
        svgHtml += `
          <line x1="${padX}" y1="${y}" x2="${W - 20}" y2="${y}" stroke="#e8e6df" stroke-width="1" stroke-dasharray="3,3" />
          <text x="${padX - 8}" y="${y + 4}" fill="#858f9e" font-size="11" font-family="var(--font-mono)" text-anchor="end">${fmtMoney(val)}</text>
        `;
      }

      // Date labels on X
      days.forEach((d, i) => {
        const x = getX(i);
        const shortDate = d.date.slice(5);
        svgHtml += `
          <text x="${x}" y="${H - 10}" fill="#858f9e" font-size="11" font-family="var(--font-mono)" text-anchor="middle">${shortDate}</text>
        `;
      });

      // Series Paths
      seriesList.forEach(s => {
        const pathData = s.pts.map((pt, i) => `${i === 0 ? 'M' : 'L'} ${getX(i).toFixed(1)} ${getY(pt.val).toFixed(1)}`).join(' ');
        svgHtml += `<path d="${pathData}" fill="none" stroke="${s.color}" stroke-width="${s.width}" stroke-linecap="round" stroke-linejoin="round" />`;

        // Points
        s.pts.forEach((pt, i) => {
          const cx = getX(i);
          const cy = getY(pt.val);
          const isCurrentTab = d => d.date === currentTab.date;
          svgHtml += `
            <circle cx="${cx}" cy="${cy}" r="${s.id === 'model' ? 4.5 : 3}" fill="${s.color}" stroke="#ffffff" stroke-width="1.5" />
          `;
        });
      });

      svg.innerHTML = svgHtml;
    }

    /* Modal: Open Stock Inspector Dossier */
    function openStockModal(ticker) {
      if (!ticker) return;
      const tab = (selectedDayIdx !== 'overview' && selectedDayIdx !== 'memory')
        ? appData.day_tabs[selectedDayIdx]
        : appData.day_tabs[appData.day_tabs.length - 1];

      const scored = (tab.watchlist_scores || []).find(s => s.ticker === ticker);
      const held = (tab.holdings || []).find(h => h.ticker === ticker);
      const price = scored ? scored.price : (held ? held.current_price : 0);
      const name = scored ? scored.name : (held ? held.name : ticker);
      const rsi = scored ? (scored.rsi14 || 50) : 50;

      // RSI Zone Gauge Text
      let tempLabel = 'Fair Value / Neutral (Balanced)';
      let tempColor = 'var(--text-secondary)';
      if (rsi < 35) { tempLabel = 'Bargain Entry Zone (Oversold)'; tempColor = 'var(--forest-green)'; }
      else if (rsi > 70) { tempLabel = 'Overheated Zone (Caution)'; tempColor = 'var(--terracotta)'; }

      const targetPrice = price * 1.12;
      const stopPrice = price * 0.94;

      const modal = document.getElementById('stockModalContent');
      modal.innerHTML = `
        <button class="modal-close-btn" onclick="closeStockModal()">✕</button>
        <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:8px;">
          <span class="ticker-chip" style="font-size:18px;padding:4px 10px;">${ticker}</span>
          <h2 style="font-family:var(--font-serif);font-size:24px;color:var(--text-primary);">${name}</h2>
        </div>
        <div style="font-size:28px;font-weight:700;font-family:var(--font-mono);margin-bottom:16px;">
          ${fmtMoney(price)}
        </div>

        <!-- Temperature Gauge -->
        <div style="background:var(--bg-subtle);padding:14px 18px;border-radius:var(--radius-md);border:1px solid var(--border-subtle);margin-bottom:20px;">
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;">14-Day Price Temperature (RSI: ${rsi.toFixed(1)})</div>
          <div style="font-size:15px;font-weight:600;color:${tempColor};">${tempLabel}</div>
          <div style="height:6px;width:100%;background:#e2dfd5;border-radius:3px;margin-top:8px;position:relative;">
            <div style="position:absolute;left:${Math.min(100, Math.max(0, rsi))}%;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--ink-navy);border:2px solid #fff;"></div>
          </div>
        </div>

        <!-- Targets Quad -->
        <div class="metrics-quad" style="grid-template-columns:1fr 1fr;margin-bottom:20px;">
          <div class="metric-box">
            <div class="metric-label">Target Take-Profit (+12%)</div>
            <div class="metric-value" style="font-size:20px;color:var(--forest-green);">${fmtMoney(targetPrice)}</div>
          </div>
          <div class="metric-box">
            <div class="metric-label">Safety Stop-Loss (-6%)</div>
            <div class="metric-value" style="font-size:20px;color:var(--terracotta);">${fmtMoney(stopPrice)}</div>
          </div>
        </div>

        <!-- Held Position Snapshot -->
        ${held ? `
          <div style="background:var(--forest-bg);border:1px solid var(--forest-border);padding:14px 18px;border-radius:var(--radius-md);margin-bottom:16px;">
            <div style="font-weight:700;color:var(--forest-green);margin-bottom:4px;">Active Portfolio Holding</div>
            <div style="font-size:13.5px;color:var(--text-primary);">
              You own <strong>${held.shares.toFixed(2)} shares</strong> worth <strong>${fmtMoney(scaled(held.value))}</strong> (Entry: ${fmtMoney(held.avg_entry_price)} on ${held.entry_date}).
              Net P&L: <strong>${held.gain_dollars >= 0 ? '+' : ''}${fmtMoney(scaled(held.gain_dollars))} (${fmtPct(held.gain_pct)})</strong>.
            </div>
          </div>
        ` : `
          <div style="background:var(--bg-subtle);border:1px solid var(--border-subtle);padding:12px 16px;border-radius:var(--radius-md);font-size:13px;color:var(--text-secondary);margin-bottom:16px;">
            Currently on Watchlist (Not active in portfolio).
          </div>
        `}

        <p style="font-size:13.5px;color:var(--text-secondary);line-height:1.6;">
          ${scored ? scored.reason : 'Disciplined equity asset monitored by quantitative models.'}
        </p>
      `;

      document.getElementById('stockModalBackdrop').style.display = 'flex';
    }

    function closeStockModal() {
      document.getElementById('stockModalBackdrop').style.display = 'none';
    }

    /* Build Overview Matrix View */
    function buildOverviewView() {
      const days = appData.day_tabs || [];
      return `
        <section class="hero-card">
          <div class="hero-pretitle">All-Time Performance Matrix</div>
          <h2 class="hero-headline">Chronological Model Evolution Across All Sessions</h2>
          <p style="color:var(--text-secondary);margin-top:8px;">Every single trading day recorded since inception with complete audit trails.</p>
        </section>

        <div class="card">
          <div class="table-wrap">
            <table class="editorial-table">
              <thead>
                <tr>
                  <th>Day</th>
                  <th>Date</th>
                  <th>Model Value</th>
                  <th>Day Return</th>
                  <th>Total Return</th>
                  <th>S&P 500</th>
                  <th>60/40 Fund</th>
                  <th>Cash Reserve</th>
                </tr>
              </thead>
              <tbody>
                ${days.map((d, i) => {
                  const p = d.portfolio;
                  return `
                    <tr class="clickable" onclick="selectTab(${i})">
                      <td style="font-weight:700;">Day ${d.day_index}</td>
                      <td>${d.date}</td>
                      <td style="font-family:var(--font-mono);font-weight:700;">${fmtMoney(scaled(p.total_value))}</td>
                      <td style="font-family:var(--font-mono);color:${p.day_change_dollars >= 0 ? 'var(--forest-green)' : 'var(--terracotta)'}">
                        ${p.day_change_dollars >= 0 ? '+' : ''}${fmtMoney(scaled(p.day_change_dollars))} (${fmtPct(p.day_change_pct)})
                      </td>
                      <td style="font-family:var(--font-mono);color:${p.total_gain_dollars >= 0 ? 'var(--forest-green)' : 'var(--terracotta)'}">
                        ${p.total_gain_dollars >= 0 ? '+' : ''}${fmtMoney(scaled(p.total_gain_dollars))} (${fmtPct(p.total_gain_pct)})
                      </td>
                      <td style="font-family:var(--font-mono);">${fmtMoney(scaled(p.spy_benchmark_value))}</td>
                      <td style="font-family:var(--font-mono);">${fmtMoney(scaled(p.balanced_60_40_value))}</td>
                      <td style="font-family:var(--font-mono);">${fmtMoney(scaled(p.cash_reserve))}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    /* Build AI Brain & Memory Log View */
    function buildMemoryView() {
      const memory = appData.model_memory || {};
      const lessons = memory.lesson_log || [];
      const weights = memory.weight_history || [];

      return `
        <section class="hero-card">
          <div class="hero-pretitle">Autonomous Brain & Adaptation Log</div>
          <h2 class="hero-headline">How the Model Learns & Re-Weights Itself Daily</h2>
          <p style="color:var(--text-secondary);margin-top:8px;">Every evening after market close, the algorithm analyzes what worked, what failed, and shifts its mathematical weights to adapt to regime changes.</p>
        </section>

        <div class="main-grid">
          <div>
            <div class="section-head">
              <div class="section-title">📖 Daily Investor's Journal & Lessons Learned</div>
            </div>
            <div style="display:flex;flex-direction:column;gap:16px;">
              ${lessons.map(l => `
                <div class="card" style="margin-bottom:0;padding:18px 22px;">
                  <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
                    <span style="font-size:12px;font-weight:700;color:var(--ink-navy);">${l.date}</span>
                    <span style="font-size:12px;color:var(--text-muted);">Session Reflection</span>
                  </div>
                  <p style="font-size:14.5px;color:var(--text-primary);line-height:1.6;">${l.lesson}</p>
                </div>
              `).join('')}
            </div>
          </div>

          <div>
            <div class="section-head">
              <div class="section-title">⚖️ Adaptive Factor Weight Evolution</div>
            </div>
            <div class="card" style="padding:16px;">
              <div class="table-wrap">
                <table class="editorial-table">
                  <thead>
                    <tr>
                      <th>Date</th>
                      <th>Trend</th>
                      <th>Dip RSI</th>
                      <th>Rel Strength</th>
                      <th>Buy Gate</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${weights.map(w => `
                      <tr>
                        <td style="font-size:12px;font-weight:600;">${w.date}</td>
                        <td style="font-family:var(--font-mono);">${w.trend_weight ? w.trend_weight.toFixed(2) : '1.00'}x</td>
                        <td style="font-family:var(--font-mono);">${w.dip_rsi_weight ? w.dip_rsi_weight.toFixed(2) : '0.80'}x</td>
                        <td style="font-family:var(--font-mono);">${w.rel_strength_weight ? w.rel_strength_weight.toFixed(2) : '1.00'}x</td>
                        <td style="font-family:var(--font-mono);">${w.buy_threshold || 69.5}/100</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    /* Boot Application */
    function bootApp() {
      if (appData && appData.day_tabs && appData.day_tabs.length > 0) {
        selectedDayIdx = appData.day_tabs.length - 1;
        renderMarketRibbon();
        renderDaySelectors();
        renderCurrentView();
      }
    }

    // Always fetch fresh JSON data with a timestamp cache-buster so users never see stale browser cache
    async function loadFreshDataAndStart() {
      try {
        const resp = await fetch('portfolio_state.json?t=' + Date.now());
        if (resp.ok) {
          const fresh = await resp.json();
          if (fresh && fresh.day_tabs && fresh.day_tabs.length > 0) {
            appData = fresh;
          }
        }
      } catch (err) {
        console.warn('Live fetch fallback to bundled data:', err);
      }
      bootApp();
    }

    loadFreshDataAndStart();
  </script>
</body>
</html>
